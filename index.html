    <!-- حارس الإقلاع. صفحة بيضاء تعني أن حزمة التطبيق نفسها لم تُحمَّل (غلاف قديم يسمّي
         حزمًا حذفها نشرٌ لاحق)، وكل طبقات التعافي داخل الحزمة لا تعمل حين لا تعمل الحزمة.
         هذا السطر يعمل دائمًا لأنه داخل الغلاف: إن لم يُعلن التطبيق إقلاعه خلال ثمان ثوانٍ،
         نمسح كاش المتصفح وعامل الخدمة ونعيد التحميل — مرة واحدة، فلا حلقة. -->
    <script>
      setTimeout(function () {
        if (window.__MIZAN_BOOTED) return;
        var K = 'mizan-boot-recovered';
        try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, '1'); } catch (e) { return; }
        var done = function () { location.reload(); };
        try {
          Promise.all([
            'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
            'caches' in window ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null,
          ]).then(done, done);
        } catch (e) { done(); }
      }, 8000);
    </script>
