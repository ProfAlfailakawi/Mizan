    <!-- Families here must stay in sync with the --font-* tokens in src/index.css.
         Previously the page fetched Alexandria / Plus Jakarta Sans while the CSS asked for
         IBM Plex Sans Arabic / Inter, so every screen silently fell back to system-ui and the
         downloaded faces were never painted. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@500;600;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#214C40" />
    <meta name="color-scheme" content="light" />
    <!-- Installed web-app behaviour. On iPadOS the venue tablet opens ميزان from the home
         screen; without apple-mobile-web-app-capable it would launch inside Safari chrome
         instead of full-screen standalone. mobile-web-app-capable is the modern equivalent
         honoured by Chromium. The title is what iOS prints under the home-screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ميزان" />
    <!-- MIZAN brand favicon. The SVG is primary; PNG fallbacks (with explicit sizes) guarantee the
         mosque mark shows on browsers with weak SVG-favicon support instead of falling back to any
         other image. shortcut icon covers legacy /favicon.ico probing. -->
    <link rel="icon" href="/brand/mizan-mark.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mizan-icon-32.png" />
