steps:
  - name: 'node:22-slim'
    id: 'publish-ready-catalog'
    entrypoint: 'bash'
    secretEnv: ['R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY']
    env:
      - 'R2_ENDPOINT=${_R2_ENDPOINT}'
      - 'R2_BUCKET=${_R2_BUCKET}'
      - 'R2_REGION=auto'
    args:
      - '-ceu'
      - |
        apt-get update -qq
        apt-get install -y --no-install-recommends ca-certificates >/dev/null
        npm install --ignore-scripts --no-audit --no-fund
        npx tsx scripts/kfgqpc-catalog-publish.ts
substitutions:
  _R2_ENDPOINT: 'https://c5d74db879abf3d428e4abdd485d338a.r2.cloudflarestorage.com'
  _R2_BUCKET: 'mizan-quran-assets'
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/R2_ACCESS_KEY_ID/versions/latest'
      env: 'R2_ACCESS_KEY_ID'
    - versionName: 'projects/$PROJECT_ID/secrets/R2_SECRET_ACCESS_KEY/versions/latest'
      env: 'R2_SECRET_ACCESS_KEY'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '900s'
