<!doctype html>
<!--
  صفحة «نضبط الميزان»: ما يراه الزائر أثناء نشر إصدارٍ جديد.

  أثناء النشر يتبدّل الخادم، فتجيب واجهةُ Google الأماميّة عن التنقّل بصفحة خطأٍ
  إنجليزية لا يكتبها خادمُ ميزان أصلًا. عاملُ الخدمة (public/sw.js) يحفظ هذه الصفحة
  عند تثبيته، ويقدّمها بدلًا من أيّ جوابٍ 500/502/503/504 أو انقطاعٍ للتنقّل —
  والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  الرسم: كفّتا ميزانٍ كبيرتان يميل عاتقُهما قليلًا ثم يستقرّ مستويًا، فوق نقشٍ هندسيّ
  خافت من نجومٍ ثمانية (خاتم سليمان). كلّه SVG مضمَّن، بلا صورٍ ولا طلباتٍ خارجية.

  مستقلّةٌ تمامًا: لا طلبَ خارجيًا، والخطُّ خطُّ ميزان إن كان محفوظًا وإلا خطُّ النظام.
  تسأل /api/health كل ثلاث ثوانٍ (وتتباطأ تدريجيًا)، فإذا أجاب أعادت فتح الصفحة
  المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في دقيقتين، تباطأت إلى
  مرّةٍ كل نصف دقيقة ولا تدور في حلقة.

  السكربتُ المضمَّن أدناه مسموحٌ ببصمته (sha256) في سياسة CSP التي يرسلها الخادم لهذه
  الصفحة وحدها (server.ts)؛ فأيُّ تعديلٍ فيه يغيّر البصمة، والخادمُ يحسبها من الملف نفسه.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a16" media="(prefers-color-scheme: dark)">
<title>نضبط الميزان · ميزان</title>
<style>
@font-face{font-family:"Mizan Plex";font-weight:400;font-display:swap;src:local("IBM Plex Sans Arabic"),url("/fonts/284d2adce0.woff2") format("woff2")}
@font-face{font-family:"Mizan Plex";font-weight:600;font-display:swap;src:local("IBM Plex Sans Arabic SemiBold"),url("/fonts/bdba2ef564.woff2") format("woff2")}
@font-face{font-family:"Mizan Display";font-weight:600;font-display:swap;src:local("Alexandria SemiBold"),url("/fonts/313baf6f04.woff2") format("woff2")}
:root{
  --bg:#f7f5ef;--bg-2:#efece2;--ink:#171b18;--muted:#565c57;
  --emerald:#214c40;--emerald-2:#2f6555;--gold:#b98b4e;--gold-2:#9b7542;
  --frame:#214c40;--frame-soft:#2f6555;--pan:#fffefb;--pan-line:#d8b172;
  --star:rgb(155 117 66 / .14);--rule:rgb(185 139 78 / .55);
  --btn:#214c40;--btn-ink:#fffefb;--btn-hover:#1a3d33;--focus:#9b7542;
  --shade:rgb(18 63 53 / .10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101a16;--bg-2:#16241f;--ink:#f4f1e8;--muted:#a9b6ae;
    --emerald:#8fbfae;--emerald-2:#8fbfae;--gold:#e8cb93;--gold-2:#d8b172;
    --frame:#d8b172;--frame-soft:#8fbfae;--pan:#16241f;--pan-line:#e8cb93;
    --star:rgb(232 203 147 / .10);--rule:rgb(232 203 147 / .45);
    --btn:#e8cb93;--btn-ink:#101a16;--btn-hover:#f1dbb0;--focus:#e8cb93;
    --shade:rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 52%,var(--bg-2) 100%);
  color:var(--ink);
  font-family:"Mizan Plex",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
}
.ground{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.ground .star{fill:none;stroke:var(--star);stroke-width:1}
main{
  position:relative;min-height:100%;
  display:grid;align-content:center;
  width:min(100%,640px);margin:0 auto;
  padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
}
/* الميزانُ إلى طرف السطر الأيسر، والكلامُ تحته منزاحٌ إلى اليمين: لا تراصّ في المنتصف. */
.scale{display:block;justify-self:end;width:min(100%,430px);height:auto;margin-inline-end:-6px;overflow:visible}
.scale .post,.scale .beam-bar{stroke:var(--frame)}
.scale .post{stroke-width:5;stroke-linecap:round}
.scale .foot{fill:var(--frame)}
.scale .foot-line{fill:none;stroke:var(--gold);stroke-width:1.4}
.scale .beam-bar{stroke-width:5.5;stroke-linecap:round;fill:none}
.scale .knob{fill:var(--gold)}
.scale .pivot{fill:var(--gold);stroke:var(--frame);stroke-width:2}
.scale .tongue{fill:var(--gold)}
.scale .gauge{fill:none;stroke:var(--frame-soft);stroke-width:2;stroke-linecap:round}
.scale .gauge-mark{stroke:var(--gold-2);stroke-width:2;stroke-linecap:round}
.scale .chain{stroke:var(--frame-soft);stroke-width:1.5;fill:none}
.scale .pan{fill:var(--pan);stroke:var(--pan-line);stroke-width:2;stroke-linejoin:round}
.scale .pan-rim{fill:none;stroke:var(--frame);stroke-width:2.4;stroke-linecap:round}
.scale .finial{fill:var(--gold)}
.scale .shadow{fill:var(--shade)}
.scale .beam,.scale .hang{transform-box:view-box}
.scale .beam{transform-origin:200px 86px;animation:weigh 9s cubic-bezier(.45,.05,.3,1) infinite}
.scale .hang.r{transform-origin:62px 86px;animation:hang 9s cubic-bezier(.45,.05,.3,1) infinite}
.scale .hang.l{transform-origin:338px 86px;animation:hang 9s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes weigh{
  0%{transform:rotate(0)}
  12%{transform:rotate(-6.5deg)}
  25%{transform:rotate(3.6deg)}
  37%{transform:rotate(-1.8deg)}
  47%{transform:rotate(.8deg)}
  55%{transform:rotate(-.3deg)}
  62%,100%{transform:rotate(0)}
}
@keyframes hang{
  0%{transform:rotate(0)}
  12%{transform:rotate(6.5deg)}
  25%{transform:rotate(-3.6deg)}
  37%{transform:rotate(1.8deg)}
  47%{transform:rotate(-.8deg)}
  55%{transform:rotate(.3deg)}
  62%,100%{transform:rotate(0)}
}
.words{
  justify-self:start;max-width:23rem;
  margin:4px 0 0;margin-inline-start:clamp(4px,5vw,44px);
  padding-inline-start:18px;border-inline-start:2px solid var(--rule);
}
.kicker{margin:0 0 6px;font-size:13px;font-weight:600;line-height:1.6;color:var(--gold-2)}
h1{margin:0;font-family:"Mizan Display","Mizan Plex",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;font-size:clamp(28px,8vw,40px);font-weight:600;line-height:1.35;letter-spacing:0;color:var(--emerald)}
.lead{margin:10px 0 0;font-size:16px;line-height:1.85;color:var(--ink)}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px}
button{
  min-height:44px;padding:0 20px;border-radius:12px;cursor:pointer;
  border:0;background:var(--btn);color:var(--btn-ink);
  font:inherit;font-size:14px;font-weight:600;
  box-shadow:0 1px 2px rgb(23 27 24 / .06),0 8px 18px var(--shade);
  transition:background-color .2s ease,transform .2s ease;
}
button:hover{background:var(--btn-hover)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.note{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
@media (min-width:720px){
  .words{margin-top:-18px}
}
@media (prefers-reduced-motion:reduce){
  .scale .beam,.scale .hang.r,.scale .hang.l{animation:none}
}
</style>
</head>
<body>
<!-- نقشٌ هندسيّ خافت: نجمةٌ ثمانية من مربّعين متراكبين، تخفت نحو الأطراف. -->
<svg class="ground" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice" viewBox="0 0 400 800">
  <defs>
    <pattern id="khatam" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(-10 4)">
      <g class="star">
        <rect x="14" y="14" width="28" height="28"/>
        <rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)"/>
        <path d="M0 28H8M48 28H56M28 0V8M28 48V56"/>
      </g>
    </pattern>
    <radialGradient id="fade" cx="62%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fade-mask"><rect width="400" height="800" fill="url(#fade)"/></mask>
  </defs>
  <rect width="400" height="800" fill="url(#khatam)" mask="url(#fade-mask)"/>
</svg>
<main>
  <!-- الميزان: العاتقُ يدور حول محوره، وكلُّ كفّةٍ تدور عكسه حول معلاقها فتبقى معلّقةً قائمة. -->
  <svg class="scale" viewBox="0 0 400 330" aria-hidden="true" focusable="false">
    <ellipse class="shadow" cx="200" cy="316" rx="120" ry="7"/>
    <path class="finial" d="M200 26l4.6 6.4L200 44l-4.6-11.6Z"/>
    <path class="post" d="M200 46V296"/>
    <path class="foot" d="M160 296h80c8 0 14 6 14 12v2H146v-2c0-6 6-12 14-12Z"/>
    <path class="foot-line" d="M170 303h60"/>
    <g class="gauge-wrap">
      <path class="gauge" d="M182 60a22 22 0 0 1 36 0"/>
      <path class="gauge-mark" d="M200 50v6"/>
    </g>
    <g class="beam">
      <path class="tongue" d="M200 52l3 30h-6Z"/>
      <path class="beam-bar" d="M62 86C120 80 160 80 200 80S280 80 338 86"/>
      <circle class="knob" cx="62" cy="86" r="5"/>
      <circle class="knob" cx="338" cy="86" r="5"/>
      <g class="hang r">
        <path class="chain" d="M62 90 22 214M62 90 62 214M62 90 102 214"/>
        <path class="pan" d="M12 214h100c-6 26-26 40-50 40s-44-14-50-40Z"/>
        <path class="pan-rim" d="M10 214h104"/>
      </g>
      <g class="hang l">
        <path class="chain" d="M338 90 298 214M338 90 338 214M338 90 378 214"/>
        <path class="pan" d="M288 214h100c-6 26-26 40-50 40s-44-14-50-40Z"/>
        <path class="pan-rim" d="M286 214h104"/>
      </g>
      <circle class="pivot" cx="200" cy="86" r="7"/>
    </g>
  </svg>
  <section class="words">
    <p class="kicker">ميزان · تحديث</p>
    <h1 id="title">نضبط الميزان</h1>
    <p class="lead" id="lead">يجري على ميزان تحديثٌ قصير، وتعود الصفحة التي طلبتها وحدها حين يستقرّ.</p>
    <div class="act">
      <button type="button" id="retry">افتح الصفحة الآن</button>
      <p class="note" id="note" role="status" aria-live="polite">نتحقّق كل بضع ثوانٍ.</p>
    </div>
  </section>
</main>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "mizan-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "الجهاز غير متّصل بالشبكة";
      lead.textContent = "متى رجع الاتصال رجعت الصفحة التي طلبتها، دون أن تفعل شيئًا.";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "نضبط الميزان";
      lead.textContent = "يأخذ الضبط هذه المرّة وقتًا أطول من المعتاد، والصفحة تعود وحدها حين يستقرّ.";
      note.textContent = "نتحقّق مرّةً كل نصف دقيقة.";
    } else {
      title.textContent = "نضبط الميزان";
      lead.textContent = "يجري على ميزان تحديثٌ قصير، وتعود الصفحة التي طلبتها وحدها حين يستقرّ.";
      note.textContent = "نتحقّق كل بضع ثوانٍ.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
