<!doctype html>
<!--
  صفحة «نُحدّث البرنامج».

  أثناء النشر يتبدّل الخادم، فتجيب واجهةُ Google الأماميّة عن التنقّل بصفحة خطأٍ
  إنجليزية لا يكتبها خادمُ ميزان أصلًا. عاملُ الخدمة (public/sw.js) يحفظ هذه الصفحة
  عند تثبيته، ويقدّمها بدلًا من أيّ جوابٍ 500/502/503/504 أو انقطاعٍ للتنقّل —
  والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تمامًا: لا طلبَ خارجيًا، والخطُّ خطُّ ميزان إن كان محفوظًا وإلا خطُّ النظام.
  تسأل /api/health كل ثلاث ثوانٍ (وتتباطأ تدريجيًا)، فإذا أجاب أعادت فتح الصفحة
  المطلوبة. وإن عادت الصفحةُ تتعثّر والخادمُ سليم ثلاثَ مرّاتٍ في دقيقتين، تباطأت إلى
  مرّةٍ كل نصف دقيقة ولا تدور في حلقة.

  السكربتُ المضمَّن أدناه مسموحٌ ببصمته (sha256) في سياسة CSP التي يرسلها الخادم لهذه
  الصفحة وحدها (server.ts)؛ فأيُّ تعديلٍ فيه يغيّر البصمة، والخادمُ يحسبها من الملف نفسه.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a16" media="(prefers-color-scheme: dark)">
<title>نُحدّث البرنامج · ميزان</title>
<style>
@font-face{font-family:"Mizan Plex";font-weight:400;font-display:swap;src:local("IBM Plex Sans Arabic"),url("/fonts/284d2adce0.woff2") format("woff2")}
@font-face{font-family:"Mizan Plex";font-weight:600;font-display:swap;src:local("IBM Plex Sans Arabic SemiBold"),url("/fonts/bdba2ef564.woff2") format("woff2")}
@font-face{font-family:"Mizan Display";font-weight:600;font-display:swap;src:local("Alexandria SemiBold"),url("/fonts/313baf6f04.woff2") format("woff2")}
:root{
  --bg:#f7f5ef;--ink:#171b18;--muted:#565c57;--line:rgb(23 27 24 / .10);
  --accent:#214c40;--glow:rgba(185,139,78,.14);--scan:#2f6555;--gold:#b98b4e;--leaf:#2f6555;
  --button:#fffefb;--button-line:rgb(23 27 24 / .14);--shadow:rgba(18,63,53,.22);--tile-line:rgba(185,139,78,.38);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101a16;--ink:#f4f1e8;--muted:#a9b6ae;--line:rgb(255 255 255 / .10);
    --accent:#d8b172;--glow:rgba(216,177,114,.16);--scan:#e8cb93;--gold:#e8cb93;--leaf:#8fbfae;
    --button:#16241f;--button-line:rgb(255 255 255 / .14);--shadow:rgba(0,0,0,.6);--tile-line:rgba(232,203,147,.30);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  background:radial-gradient(circle at 50% 40%,var(--glow),transparent 46%),var(--bg);
  color:var(--ink);
  font-family:"Mizan Plex",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-align:center;
}
main{display:grid;justify-items:center;gap:0;max-width:420px;width:100%}
.stage{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:30px}
.halo{position:absolute;inset:0;width:100%;height:100%;animation:turn 3.6s linear infinite}
.halo circle{fill:none;stroke-width:2;stroke-linecap:round}
.halo .track{stroke:var(--line)}
.halo .arc{stroke:var(--accent);stroke-dasharray:96 400;opacity:.85}
.mark{width:84px;height:84px;display:block;filter:drop-shadow(0 18px 30px var(--shadow))}
.mark .tile-line{stroke:var(--tile-line)}
.mark .needle{transform-box:view-box;transform-origin:60px 42px;animation:weigh 2.4s cubic-bezier(.45,0,.25,1) infinite}
.mark .finial{animation:settle 2.4s cubic-bezier(.16,1,.3,1) infinite}
.spark{position:absolute;fill:var(--gold);animation:twinkle 2.4s ease-in-out infinite}
.spark.one{width:20px;height:20px;top:6px;inset-inline-start:8px}
.spark.two{width:12px;height:12px;bottom:14px;inset-inline-end:6px;fill:var(--leaf);animation-delay:1.2s}
h1{margin:0;font-family:"Mizan Display","Mizan Plex",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;font-size:clamp(22px,5.6vw,27px);font-weight:600;line-height:1.5;letter-spacing:0}
.lead{margin:6px 0 0;font-size:16px;line-height:1.7;color:var(--muted)}
.pulse{width:132px;height:2px;margin:26px 0 28px;border-radius:99px;background:var(--line);overflow:hidden}
.pulse i{display:block;width:36%;height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,var(--scan),transparent);animation:scan 1.5s ease-in-out infinite}
button{
  min-height:44px;padding:0 22px;border-radius:12px;cursor:pointer;
  border:1px solid var(--button-line);background:var(--button);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;
  transition:border-color .2s ease,transform .2s ease;
}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.note{min-height:20px;margin:14px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes weigh{0%,100%{transform:rotate(0)}30%{transform:rotate(3.2deg)}65%{transform:rotate(-2deg)}}
@keyframes settle{0%{transform:translateY(-3px);opacity:.6}45%,100%{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
@keyframes scan{0%{transform:translateX(130%)}100%{transform:translateX(-360%)}}
@media (prefers-reduced-motion:reduce){
  .halo,.mark .needle,.mark .finial,.spark,.pulse i{animation:none}
  .spark{opacity:.8}
}
</style>
</head>
<body>
<main>
  <div class="stage" aria-hidden="true">
    <svg class="halo" viewBox="0 0 132 132" focusable="false"><circle class="track" cx="66" cy="66" r="63"/><circle class="arc" cx="66" cy="66" r="63"/></svg>
    <!-- علامة ميزان كما في public/brand/mizan-mark.svg، والإبرة وحدها تتحرّك. -->
    <svg class="mark" viewBox="0 0 120 120" focusable="false">
      <defs>
        <linearGradient id="mz-a" x1="26" y1="30" x2="94" y2="96" gradientUnits="userSpaceOnUse"><stop stop-color="#123F35"/><stop offset="1" stop-color="#2C6656"/></linearGradient>
        <linearGradient id="mz-g" x1="60" y1="30" x2="60" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#E8CB93"/><stop offset=".55" stop-color="#B98B4E"/><stop offset="1" stop-color="#E8CB93"/></linearGradient>
        <linearGradient id="mz-p" x1="60" y1="58" x2="78" y2="98" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF6"/><stop offset="1" stop-color="#F3E8D2"/></linearGradient>
      </defs>
      <rect width="120" height="120" rx="26" fill="#F7F5EF"/>
      <rect class="tile-line" x="1" y="1" width="118" height="118" rx="25" fill="none" stroke-width="1.4"/>
      <g transform="translate(0 3)">
        <path class="finial" d="M60 2.5 64.6 8.6 60.9 13.2V34h-1.8V13.2L55.4 8.6Z" fill="url(#mz-g)"/>
        <path d="M22 41H98" fill="none" stroke="url(#mz-a)" stroke-width="4.6" stroke-linecap="round"/>
        <path d="M22 41 21 60.5M22 41 44 64.5M98 41 99 60.5M98 41 76 64.5" fill="none" stroke="url(#mz-a)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M60 96c-12-8.5-26.5-11-40-9-.5 6 4 11.5 11.5 13.5 13.5 0 22.5 2 28.5 5.5Z" fill="url(#mz-a)"/>
        <path d="M60 96c12-8.5 26.5-11 40-9 .5 6-4 11.5-11.5 13.5-13.5 0-22.5 2-28.5 5.5Z" fill="url(#mz-a)"/>
        <path d="M60 71c-13.5-9.5-27-13.5-40-11.5 2 8.5 2 19 0 27.5 13.5-2 28 .5 40 9Z" fill="url(#mz-p)" stroke="#D8B172" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M60 71c13.5-9.5 27-13.5 40-11.5-2 8.5-2 19 0 27.5-13.5-2-28 .5-40 9Z" fill="url(#mz-p)" stroke="#D8B172" stroke-width="1.5" stroke-linejoin="round"/>
        <g class="needle">
          <path d="M60 43c.85 0 1.35 2.2 1.5 9.4l.55 33.6c.08 6.2-.7 11.4-2.05 15.5-1.35-4.1-2.13-9.3-2.05-15.5l.55-33.6c.15-7.2.65-9.4 1.5-9.4Z" fill="url(#mz-g)"/>
          <circle cx="60" cy="39" r="5.4" fill="url(#mz-g)"/>
          <circle cx="58.3" cy="37.2" r="1.9" fill="#FFF6E4" opacity=".55"/>
        </g>
      </g>
    </svg>
    <svg class="spark one" viewBox="0 0 24 24" focusable="false"><path d="M12 0c.7 6.4 5.6 11.3 12 12-6.4.7-11.3 5.6-12 12-.7-6.4-5.6-11.3-12-12C6.4 11.3 11.3 6.4 12 0z"/></svg>
    <svg class="spark two" viewBox="0 0 24 24" focusable="false"><path d="M12 0c.7 6.4 5.6 11.3 12 12-6.4.7-11.3 5.6-12 12-.7-6.4-5.6-11.3-12-12C6.4 11.3 11.3 6.4 12 0z"/></svg>
  </div>
  <h1 id="title">نُحدّث البرنامج الآن ✨</h1>
  <p class="lead" id="lead">لحظاتٍ ونعود</p>
  <div class="pulse" aria-hidden="true"><i></i></div>
  <button type="button" id="retry">أعد المحاولة الآن</button>
  <p class="note" id="note" role="status" aria-live="polite">ستُفتح الصفحة التي طلبتها تلقائيًا حين نعود.</p>
</main>
<script>
(function () {
  var HEALTH = "/api/health";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "mizan-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ سليم تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    remember();
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "لا اتصال بالإنترنت الآن";
      lead.textContent = "سنعود تلقائيًا حين يعود الاتصال";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "نُحدّث البرنامج الآن ✨";
      lead.textContent = "يستغرق ذلك وقتًا أطول من المعتاد";
      note.textContent = "سنحاول مرّةً كل نصف دقيقة، ويمكنك المحاولة الآن.";
    } else {
      title.textContent = "نُحدّث البرنامج الآن ✨";
      lead.textContent = "لحظاتٍ ونعود";
      note.textContent = "ستُفتح الصفحة التي طلبتها تلقائيًا حين نعود.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", function () {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  });
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
