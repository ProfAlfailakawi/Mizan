# مستمعُ GPU داخل Cloud Build — بناءٌ فدفعٌ فنشرٌ فصلاحيةُ النداء — يُشغَّل يدويًّا من
# .github/workflows/deploy-listener-gpu.yml (docs/LISTENER-GPU.md)، ولا يدخل نشرَ ميزان الدوريّ.
#
# النشرُ هنا لا في عدّاء GitHub: حسابُ النشر هناك لا يملك من Cloud Run إلا run.viewer
# (scripts/setup-github-cloudrun-wif.sh)، وحسابُ البناء هو الذي ينشر ميزانَ ومستمعَه كلَّ يوم
# (cloudbuild.yaml) — فيُنشر هذا بالحساب نفسه وعلى الشكل نفسه.
#
# صياغة: Cloud Build يستبدل PROJECT_ID وCOMMIT_SHA والبدائلَ المبدوءةَ بشرطةٍ سفليّة قبل الصدفة؛
# ومتغيّراتُ الصدفة هنا بالصغيرة كما في cloudbuild.yaml، فلا تُعدّ استبدالًا.
#
# التحقّقُ من العتاد (`on cuda`) والتوجيهُ خارج هذا الملف: Cloud Build لا يُصدر رمزَ هويّةٍ لقراءة
# `/health` (ردّ 404 في التشغيلة الخامسة)، فيقرأ الـworkflow سطرَ الإقلاع من سجلّ الخدمة نفسها.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.gpu', '-t', '${_TAG}', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_TAG}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        # مجسُّ الإقلاع على `/ready` كما في المستمع العاديّ: لا حركةَ قبل النموذج. وعلى الرسوميّ
        # يُحمَّل النموذجُ في ثوانٍ، فخمسُ دقائق سقفٌ يكشف العطبَ سريعًا (MIZAN_LISTENER_DEVICE=cuda
        # لا يرجع إلى CPU: إن غاب CUDA بقيت `/ready` 503 وسقط النشرُ هنا بدل أن يعمل بطيئًا بصمت).
        gcloud run deploy mizan-quran-listener-gpu \
          --image '${_TAG}' \
          --region '${_REGION}' --platform managed --no-allow-unauthenticated \
          --gpu 1 --gpu-type nvidia-l4 --no-gpu-zonal-redundancy \
          --cpu 4 --memory 16Gi --concurrency 8 \
          --min-instances '${_MIN_INSTANCES}' --max-instances 1 \
          --no-cpu-throttling --cpu-boost --timeout 60 \
          --set-env-vars 'MIZAN_LISTENER_DEVICE=cuda,MIZAN_BUILD_SHA=${COMMIT_SHA}' \
          --startup-probe=httpGet.path=/ready,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=10,timeoutSeconds=5,failureThreshold=30 \
          --quiet
        url="$(gcloud run services describe mizan-quran-listener-gpu --region '${_REGION}' --format='value(status.url)')"
        test -n "$url"
        runtime_sa="$(gcloud run services describe mizan --region me-central1 --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)"
        if [ -z "$runtime_sa" ]; then
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
        fi
        gcloud run services add-iam-policy-binding mizan-quran-listener-gpu --region '${_REGION}' \
          --member "serviceAccount:${runtime_sa}" --role roles/run.invoker --quiet >/dev/null


substitutions:
  _TAG: ''
  _REGION: europe-west1
  _MIN_INSTANCES: '0'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
