# إرجاعُ ميزان إلى مستمع CPU وحده — بلا بناءٍ ولا نشر، فيعمل ولو كانت خدمةُ GPU معطوبة.
# يُشغَّل من .github/workflows/deploy-listener-gpu.yml بـroute=cpu (docs/LISTENER-GPU.md).
# ويجري بحساب البناء كما يجري النشر: حسابُ عدّاء GitHub لا يملك تعديلَ خدمة ميزان.
steps:
  - id: route-cpu
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        url="$(gcloud run services describe mizan-quran-listener --region me-central1 --format='value(status.url)')"
        test -n "$url"
        gcloud run services update mizan --region me-central1 \
          --update-env-vars "MIZAN_QURAN_PRACTICE_LISTENER_URL=${url}/listen" --quiet
        echo "MIZAN_GPU_ROUTE mizan -> ${url}/listen"
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
