name: Final UX batch validation

on:
  push:
    branches: ['fix/final-ux-mfa-2026-09-08']
    paths: ['.github/workflows/final-ux-mfa-batch.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: lint + security source gates
        run: npm run lint
      - name: tests
        run: npm test
      - name: Arabic UI audit
        run: npm run arabic:audit
      - name: build
        run: npm run build
      - name: dependency audit
        run: npm audit --audit-level=high
