name: تثبيت حزمة ملاحظات ميزان وMFA النهائية

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ux-mfa-batch.yml'
      - 'APPLY_MIZAN_FINAL_UX_MFA_2026_09_08.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-final-ux-mfa-batch
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: إعداد Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: إصلاح استبدال regex داخل أداة الحزمة
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('APPLY_MIZAN_FINAL_UX_MFA_2026_09_08.py')
          s=p.read_text(encoding='utf-8')
          old='nxt,n=re.subn(pattern,repl,text,count=1,flags=flags)'
          new='nxt,n=re.subn(pattern,lambda _m: repl,text,count=1,flags=flags)'
          if old not in s and new not in s:
              raise SystemExit('sub_once anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: تطبيق الحزمة
        run: python3 APPLY_MIZAN_FINAL_UX_MFA_2026_09_08.py

      - name: عرض التغييرات
        run: git status --short

      - name: فحص الأنواع
        run: npm run lint

      - name: الاختبارات
        run: npm test

      - name: تدقيق المصدر والأسرار
        run: npm run source-audit

      - name: تدقيق الواجهة العربية
        run: npm run arabic-ui-audit

      - name: البناء
        run: npm run build

      - name: فحوص الحزمة الخاصة
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "افتح Google Authenticator" -n src/components/auth
          ! grep -R "MZ 417" -n src/components/admin/EnterpriseWorkspace.tsx
          ! grep -R "المتسابق يبدأ سحب سؤاله" -n src/components/admin/CompetitionOverview.tsx
          ! grep -R "العزل والتجميد والحذف تفرض من الخادم" -n src/components/admin/IdentityGovernance.tsx

      - name: حفظ التعديلات ودفعها إلى main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git rm -f APPLY_MIZAN_FINAL_UX_MFA_2026_09_08.py .github/workflows/final-ux-mfa-batch.yml
          TARGETS=(
            "src/components/auth/TotpSecurity.tsx"
            "src/components/auth/AuthPortal.tsx"
            "src/components/admin/IdentityGovernance.tsx"
            "src/components/admin/TenantConsole.tsx"
            "src/components/layout/Header.tsx"
            "src/components/admin/RolePortals.tsx"
            "src/lib/competition-config.ts"
            "src/lib/store.ts"
            "src/components/admin/CompetitionOverview.tsx"
            "src/components/public/RegistrationFlow.tsx"
            "src/components/admin/DeploymentStudio.tsx"
            "src/components/admin/EnterpriseWorkspace.tsx"
            "tests/totp-mfa-flow.test.ts"
            "tests/final-ux-mfa-batch.test.ts"
          )
          git add -- "${TARGETS[@]}"
          git diff --name-only | grep '^src/.*\.tsx\?$' | xargs -r git add --
          if git diff --cached --quiet; then
            echo "materialized=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed during validation; refusing stale push"
            exit 1
          fi
          git config user.name "MIZAN CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: simplify owner UX and harden authenticator setup"
          git push origin HEAD:main
          echo "materialized=1" >> "$GITHUB_OUTPUT"

      - name: تشغيل الفحص النهائي على commit المصدر
        if: steps.persist.outputs.materialized == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
