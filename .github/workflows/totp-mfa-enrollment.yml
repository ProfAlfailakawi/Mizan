name: تفعيل MFA الحقيقي لمالك ميزان

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_TOTP_MFA_2026_09_08.py'
      - '.github/workflows/totp-mfa-enrollment.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-totp-mfa-enrollment
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: جلب أحدث main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: إعداد Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: تطبيق تسجيل TOTP ومسار الدخول بالعامل الثاني
        run: python3 APPLY_TOTP_MFA_2026_09_08.py

      - name: فحص فرق المصدر
        run: git diff --check

      - name: فحص الأنواع
        run: npm run lint

      - name: الاختبارات
        run: npm test

      - name: تدقيق المصدر والأسرار
        run: npm run source-audit

      - name: تدقيق الواجهة العربية
        run: npm run arabic-ui-audit

      - name: فحص الأسرار
        run: npm run secret-scan

      - name: البناء
        run: npm run build

      - name: حفظ التنفيذ الفعلي وتنظيف ملفات المرحلة
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(
            src/components/design-system/RealQRCode.tsx
            src/components/auth/TotpSecurity.tsx
            src/components/auth/AuthPortal.tsx
            src/App.tsx
            src/components/admin/RolePortals.tsx
            tests/totp-mfa-flow.test.ts
          )
          git add -- "${TARGETS[@]}"
          git rm -f -- APPLY_TOTP_MFA_2026_09_08.py .github/workflows/totp-mfa-enrollment.yml
          git diff --cached --check
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main changed while TOTP checks were running; refusing stale push.'
            exit 1
          fi
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(auth): add TOTP enrollment and second-factor sign-in'
          git push origin HEAD:main
          echo 'persisted=1' >> "$GITHUB_OUTPUT"

      - name: تشغيل CI النهائي على commit الجديد
        if: steps.persist.outputs.persisted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
