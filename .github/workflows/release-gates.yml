name: بوّابات الإطلاق — ما يحتاج أسرارًا

# البوّابتان هنا تحتاجان أسرارَ بيئةٍ حقيقية، فلا تعملان على جهاز التطوير.
# وكانتا تُسجَّلان «محجوبة بإعداد خارجي» في كل تقرير — وهي حقيقة، لكنّها تبقى حقيقةً
# إلى الأبد ما لم يُشغَّل شيءٌ حيث توجد الأسرار. فتُشغَّلان هنا.
#
# **وموضعُ التشغيل صُوِّب.** كُتب هذا الملفُّ أوّلَ مرّةٍ ليعمل على كلّ `pull_request`،
# وكان ذلك خطأً في التصميم: **موضوعُ هاتين البوّابتين حالةُ التخزين والبيئة، لا فرقُ
# الدفعة.** فلا يوجد تغييرٌ في شيفرة أيِّ دفعةٍ يجعلهما خضراوين ما دامت الشجرةُ على R2
# بلا كتالوج تحقّق — فتحمرّ كلُّ دفعةٍ في المستودع أبدًا، ولو لم تمسّ R2 بحرف. وذلك
# يُعلّم الفريقَ تجاهلَ الأحمر، وهو أسوأ ما يُصنع ببوّابة.
#
# فصارت تعمل حيث يعيش موضوعُها: على `main`، ويوميًّا، وعند الطلب. **ولم تُعطَّل ولم
# تُجعل اختيارية:** تظلّ تعمل وتظلّ تفشل بصوتٍ عالٍ ما دامت العلّةُ قائمة، ويظلّ الحكمُ
# المسجَّل `NOT RELEASE READY`.
#
# وشيفرةُ البوّابتين نفسُها مُختبَرةٌ في كلّ دفعة عبر `verify`:
# `tests/quran-verify-r2-diagnosis.test.ts` و`tests/r2-delivery-verification.test.ts`
# و`tests/release-gates-workflow.test.ts`. فالقسمةُ صحيحة: الشيفرةُ تُفحص على الدفعات،
# وحالةُ التخزين تُفحص على مسار الإصدار.
#
# والقاعدة التي تحكم هذا الملف كلَّه:
#
#   · سرٌّ **غائب** ⇒ تُتخطّى البوّابة ويُذكر اسمُ ما ينقص. لا تحمرّ الدفعة لغياب سرّ:
#     مساهمٌ من فرعٍ خارجيّ لا يملكه، وإحمرارُها عليه يمنعه من المساهمة بلا ذنب.
#   · سرٌّ **حاضر** والبوّابة تفشل ⇒ تحمرّ الدفعة. فالسرُّ موجودٌ والفشلُ حقيقيّ.
#
# ولا تُطبع قيمةُ سرٍّ قطّ، ولا طولُها، ولا أوّلُ حروفها. المطبوعُ اسمٌ وحضورٌ أو غياب.

on:
  push:
    branches: [main]
  schedule:
    # كل يومٍ في الرابعة صباحًا بتوقيت UTC: حالةُ التخزين تتغيّر من خارج المستودع،
    # فلا يكفي أن تُفحص عند الدمج وحده.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-backed-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci

      # ── حزمةُ الهوية: فحص ما قبل الانطلاق ───────────────────────────────────
      - name: فحص ما قبل الانطلاق (يحتاج إعداد Firebase)
        env:
          VITE_REQUIRE_AUTH: ${{ secrets.VITE_REQUIRE_AUTH }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          MIZAN_LEGAL_ENTITY_NAME: ${{ secrets.MIZAN_LEGAL_ENTITY_NAME }}
          MIZAN_LEGAL_TERMS_URL: ${{ secrets.MIZAN_LEGAL_TERMS_URL }}
          MIZAN_LEGAL_TERMS_VERSION: ${{ secrets.MIZAN_LEGAL_TERMS_VERSION }}
          MIZAN_LEGAL_TERMS_EFFECTIVE: ${{ secrets.MIZAN_LEGAL_TERMS_EFFECTIVE }}
          MIZAN_LEGAL_PRIVACY_URL: ${{ secrets.MIZAN_LEGAL_PRIVACY_URL }}
          MIZAN_LEGAL_PRIVACY_VERSION: ${{ secrets.MIZAN_LEGAL_PRIVACY_VERSION }}
          MIZAN_LEGAL_PRIVACY_EFFECTIVE: ${{ secrets.MIZAN_LEGAL_PRIVACY_EFFECTIVE }}
        shell: bash
        run: |
          set -uo pipefail
          # إعدادُ Firebase ليس غائبًا: هو في `substitutions` من `cloudbuild.yaml`، ومنه
          # يُبنى ما يُنشر فعلًا. وكانت البوّابة تنتظره سرًّا لا وجودَ له، فتُتخطّى أبدًا
          # وهي تبدو مضبوطة. فيُقرأ من مصدره، ويبقى السرُّ — إن ضُبط — هو المقدَّم.
          for pair in VITE_REQUIRE_AUTH:_VITE_REQUIRE_AUTH \
                      VITE_FIREBASE_API_KEY:_VITE_FIREBASE_API_KEY \
                      VITE_FIREBASE_PROJECT_ID:_VITE_FIREBASE_PROJECT_ID; do
            name="${pair%%:*}"; substitution="${pair##*:}"
            if [[ -z "${!name:-}" ]]; then
              if value="$(node scripts/cloudbuild-substitution.mjs "$substitution")"; then
                printf -v "$name" '%s' "$value"; export "${name?}"
                echo "  · $name مقروءٌ من cloudbuild.yaml"
              fi
            else
              echo "  · $name مضبوطٌ سرًّا"
            fi
          done

          missing=()
          for name in VITE_REQUIRE_AUTH VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID; do
            [[ -z "${!name:-}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::notice title=preflight متخطّى::لم تُضبط ولا تُقرأ من cloudbuild.yaml: ${missing[*]}"
            echo "- ⏭️ **preflight** متخطّى — لم تُضبط: \`${missing[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "الإعداد حاضر — تشغيل preflight" >> "$GITHUB_STEP_SUMMARY"
          npm run preflight

      # ── حزمةُ R2: جردٌ تشخيصيّ قبل الحكم ─────────────────────────────────────
      # يُقرأ ولا يُكتب. سببُه أن فشلَ التحقّق أدناه لا يميّز بين: رفعٍ لم يجرِ بعد،
      # ومُرفِّعٍ لم يُبنَ أصلًا، وتخطيطٍ مهجورٍ شجرتُه الحيّة تحت مفتاحٍ آخر. فيُسأل
      # التخزينُ نفسه أوّلًا، ويُطبع عددُ الكائنات وحجمُها — لا مفتاحٌ ولا اسمُ دلوٍ ولا سرّ.
      - name: جردُ شجرة R2 (قراءة محضة)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for name in R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [[ -z "${!name:-}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::notice title=r2:inventory متخطّى::لم تُضبط: ${missing[*]}"
            exit 0
          fi
          npm run r2:inventory -- --depth=3

      # ── حزمةُ R2: التحقّق من حزم القرآن المرفوعة ─────────────────────────────
      - name: التحقّق من حزم القرآن على R2
        if: always()
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for name in R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [[ -z "${!name:-}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::notice title=quran:verify-r2 متخطّى::لم تُضبط: ${missing[*]}"
            echo "- ⏭️ **quran:verify-r2** متخطّى — لم تُضبط: \`${missing[*]}\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "الأسرار حاضرة — تشغيل التحقّق العميق من العشرين" >> "$GITHUB_STEP_SUMMARY"
          # `--deep` يقارن البصمات لا الوجود: حزمةٌ موجودةٌ ببايتات أخرى تمرّ بلا هذا.
          npm run quran:verify-r2 -- --all --deep
