# تجميد مصاحف «التيسير» من alwa7y.com في R2.
# كل ملفٍّ يُسحب، وتُطابَق بصمته sha256 المسجَّلة عند السحب الأول (26 سبتمبر 2026)،
# ولا يُرفع إن خالفت. ثم يُعاد تنزيله من R2 وتُطابَق البصمة مرة ثانية.
# لا تُطبع قيمة أيّ سرّ.
name: alwa7y-r2-freeze

on:
  push:
    branches: [claude/clever-turing-gy1d9j]
    paths: [.github/workflows/alwa7y-r2-freeze.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Fetch, verify, upload, re-verify
        run: |
          set -euo pipefail
          while read -r name sha size url; do
            key="crosswalk/alwa7y/$name"
            # مجمَّدٌ سابقًا بالبصمة نفسها؟ يُتحقق منه من R2 مباشرة ولا يُعاد سحبه من المصدر،
            # فإعادة التشغيل لا تتعلّق بتوفّر موقعٍ خارجي قد يتغيّر أو يحجب.
            mkdir -p "$(dirname "$name")" "$(dirname "check-$name")"
            if [ "$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" \
                  --query 'Metadata.sha256' --output text 2>/dev/null || true)" = "$sha" ]; then
              aws s3 cp "s3://$R2_BUCKET/$key" "check-$name" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              echo "$sha  check-$name" | sha256sum -c -
              echo "ALREADY FROZEN $key $sha $size"
              continue
            fi
            curl -fsSL --retry 3 -o "$name" "${url:-http://www.alwa7y.com/downloads/$name}"
            [ "$(head -c4 "$name")" = "%PDF" ] || { echo "$name: not a PDF"; exit 1; }
            [ "$(stat -c%s "$name")" = "$size" ] || { echo "$name: size mismatch"; exit 1; }
            echo "$sha  $name" | sha256sum -c -
            aws s3 cp "$name" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" \
              --metadata "sha256=$sha" --only-show-errors
            aws s3 cp "s3://$R2_BUCKET/$key" "check-$name" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "$sha  check-$name" | sha256sum -c -
            echo "FROZEN $key $sha $size"
          done <<'LIST'
