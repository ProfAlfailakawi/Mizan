name: نشر ميزان إلى Cloud Run

# النشر مملوك للمستودع نفسه، لكنه لا يعمل إلا بعد نجاح CI على push إلى main.
# لا يوجد workflow_dispatch متجاوز للحارس، ولا checkout لـSHA مأخوذ من workflow_run.
on:
  workflow_run:
    workflows:
      - فحص ميزان — لا نشر فوق فحص أحمر
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mizan-production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: mizan-f2ce3
  GCP_REGION: me-central1
  CLOUD_RUN_SERVICE: mizan
  SOURCE_STAGING_BUCKET: gs://mizan-f2ce3-github-deploy-source/source
  GCP_BUILD_SERVICE_ACCOUNT: mizan-cloud-build@mizan-f2ce3.iam.gserviceaccount.com

jobs:
  deploy:
    # workflow_run يستطيع أن يكون ذا صلاحيات مرتفعة، لذلك نسمح فقط بنتيجة CI ناجحة
    # ناتجة من push إلى main. PRs والفروع الجانبية لا تدخل هذا المسار.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # مهم أمنيًا: لا نستخدم workflow_run.head_sha كـref للـcheckout في workflow مميز.
      # نأخذ main الموثوق فقط، ثم نثبت أنه ما زال نفس الـSHA الذي اجتاز CI.
      - name: جلب main الموثوق
        uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: إثبات أن main الحالي هو الـcommit الذي اجتاز CI
        id: source
        shell: bash
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid CI SHA" >&2
            exit 1
          fi
          checked_sha="$(git rev-parse HEAD)"
          if [[ "$checked_sha" != "$CI_SHA" ]]; then
            echo "main moved after this CI run; refusing a stale privileged deployment." >&2
            echo "CI SHA:      $CI_SHA" >&2
            echo "current main: $checked_sha" >&2
            exit 1
          fi
          echo "sha=$checked_sha" >> "$GITHUB_OUTPUT"
          echo "Deploying verified trusted main commit: $checked_sha"

      - name: التحقق من إعداد هوية النشر
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "$WIF_PROVIDER" || -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then
            cat >&2 <<'EOF'
          Cloud Run deployment identity is not configured.
          Run this once from Google Cloud Shell after this PR is merged:
            bash scripts/setup-github-cloudrun-wif.sh
          The script prints (and, when gh is authenticated, sets) these repository variables:
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT
          EOF
            exit 1
          fi

      - name: مصادقة Google Cloud بلا مفتاح دائم
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: تجهيز gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 500.0.0'

      - name: إثبات هوية النشر
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config set project "$GCP_PROJECT_ID" --quiet
          gcloud iam service-accounts describe "$GCP_BUILD_SERVICE_ACCOUNT" --project="$GCP_PROJECT_ID" --quiet >/dev/null

      - name: بناء ونشر النسخة إلى Cloud Run
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          # `builds submit --service-account` يريد اسم المورد كاملًا لا البريد:
          #   projects/<PROJECT>/serviceAccounts/<EMAIL>
          # والبريد وحده يُردّ بـ INVALID_ARGUMENT «Failed to parse resource name» بعد رفع
          # المصدر مباشرة — فيبدو كأن البناء فشل وهو لم يُنشأ أصلًا. والخطوة التي قبله
          # (`iam service-accounts describe`) تريد البريد، فلا يصلح توحيدهما على صيغة واحدة.
          gcloud builds submit . \
            --project="$GCP_PROJECT_ID" \
            --config=cloudbuild.yaml \
            --service-account="projects/$GCP_PROJECT_ID/serviceAccounts/$GCP_BUILD_SERVICE_ACCOUNT" \
            --gcs-source-staging-dir="$SOURCE_STAGING_BUCKET" \
            --substitutions="COMMIT_SHA=$VERIFIED_SHA" \
            --quiet

      - name: التحقق من أن Cloud Run يخدم الـcommit نفسه
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --format=json)"

          ready_revision="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
          created_revision="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$service_json")"
          service_url="$(jq -r '.status.url // empty' <<<"$service_json")"
          deployed_sha="$(jq -r '.metadata.labels["mizan-git-sha"] // empty' <<<"$service_json")"

          if [[ -z "$ready_revision" || -z "$service_url" ]]; then
            echo 'Cloud Run has no ready revision or service URL after deployment.' >&2
            exit 1
          fi
          if [[ "$created_revision" != "$ready_revision" ]]; then
            echo "Newest Cloud Run revision is not ready: created=$created_revision ready=$ready_revision" >&2
            exit 1
          fi
          if [[ "$deployed_sha" != "$EXPECTED_SHA" ]]; then
            echo "Cloud Run SHA mismatch: expected=$EXPECTED_SHA deployed=$deployed_sha" >&2
            exit 1
          fi

          http_ok=false
          health_url="${service_url%/}/api/health"
          for attempt in $(seq 1 12); do
            code="$(curl -L -sS -o /tmp/mizan-health.json -w '%{http_code}' --max-time 15 "$health_url" || true)"
            if [[ "$code" =~ ^2 ]]; then
              http_ok=true
              cat /tmp/mizan-health.json || true
              break
            fi
            echo "Health attempt $attempt/12 returned ${code:-network-error}; retrying..."
            sleep 5
          done
          if [[ "$http_ok" != true ]]; then
            echo "Cloud Run revision is ready but /api/health did not return 2xx." >&2
            exit 1
          fi

          echo "revision=$ready_revision" >> "$GITHUB_OUTPUT"
          echo "url=$service_url" >> "$GITHUB_OUTPUT"

      # ── صدقُ العنوان الذي يُحال إليه الموقِّع ───────────────────────────────
      #
      # `cloudbuild.yaml` يضبط `MIZAN_LEGAL_*_URL`، و`legal-documents.ts` يكتبه في أثر
      # الموافقة. وبينهما فجوةٌ لا يسدّها ملفّ: أن يكون العنوانُ مكتوبًا صحيحًا وهو يشير
      # إلى صفحةٍ لا وجود لها، أو إلى نسخةٍ غير التي تُسجَّل. وحينها يعمل كلُّ شيء —
      # ويُكتب في الأثر أن فلانًا وافق على وثيقةٍ لا يراها أحد.
      #
      # فتُجلب الصفحتان **من الإنتاج بعد نشره**، ويُقارن ما تردّانه بما ضُبط. والقيمُ
      # تُقرأ من عقد النشر نفسِه لا من أسرار المستودع: هي ليست أسرارًا، ومصدرُها الوحيد
      # هو ما يُنشر فعلًا.
      - name: التحقق من أن الوثيقتين منشورتان على عنوانيهما
        shell: bash
        run: |
          set -uo pipefail
          for name in MIZAN_LEGAL_ENTITY_NAME \
                      MIZAN_LEGAL_TERMS_URL MIZAN_LEGAL_TERMS_VERSION MIZAN_LEGAL_TERMS_EFFECTIVE \
                      MIZAN_LEGAL_PRIVACY_URL MIZAN_LEGAL_PRIVACY_VERSION MIZAN_LEGAL_PRIVACY_EFFECTIVE; do
            if value="$(node scripts/cloudbuild-substitution.mjs --env "$name")"; then
              printf -v "$name" '%s' "$value"; export "${name?}"
            fi
          done
          npm run verify:legal-publication | tee /tmp/legal-publication.txt
          status="${PIPESTATUS[0]}"
          {
            echo '## الوثيقتان القانونيّتان'
            echo
            echo '```'
            cat /tmp/legal-publication.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: ملخص النشر
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.source.outputs.sha }}
          READY_REVISION: ${{ steps.verify.outputs.revision }}
          SERVICE_URL: ${{ steps.verify.outputs.url }}
        run: |
          {
            echo '## Cloud Run deployment verified'
            echo
            echo "- Commit: \`$VERIFIED_SHA\`"
            echo "- Revision: \`$READY_REVISION\`"
            echo "- URL: $SERVICE_URL"
            echo '- Result: build, deploy, revision identity, and /api/health readiness all passed.'
          } >> "$GITHUB_STEP_SUMMARY"
