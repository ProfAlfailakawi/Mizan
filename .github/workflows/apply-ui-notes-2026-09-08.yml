name: تطبيق ملاحظات واجهة ميزان 2026-09-08

on:
  push:
    branches: [main]
    paths:
      - 'MIZAN_UI_NOTES_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-ui-notes-2026-09-08
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: إعداد Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: تطبيق الملاحظات
        run: python3 APPLY_UI_NOTES_2026_09_08.py

      - name: إكمال النوع والحفاظ على بوابات السلامة
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/store.ts')
          s=p.read_text(encoding='utf-8')
          old='  User,\n  Role,'
          new='  User,\n  CompetitionPolicy,\n  Role,'
          if old in s:
              s=s.replace(old,new,1)
          weak="if(issues.length||blockers.length) return {ok:false,issues:[...issues,...blockers.map(x=>x.title)],scientificBlockers,contradictions};"
          safe="if(issues.length||blockers.length||(productionMode&&scientificBlockers.length)) return {ok:false,issues:[...issues,...blockers.map(x=>x.title),...scientificBlockers.map(x=>x.message)],scientificBlockers,contradictions};"
          if weak in s:
              s=s.replace(weak,safe,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: عرض التغييرات
        run: git status --short

      - name: فحص TypeScript
        run: npm run lint

      - name: الاختبارات
        id: tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          tail -n 220 test-output.log
          exit $status

      - name: حفظ سجل فشل الاختبارات
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ui-notes-test-output
          path: test-output.log
          if-no-files-found: error

      - name: تدقيق المصدر
        run: npm run source-audit

      - name: تدقيق العربية
        run: npm run arabic-ui-audit

      - name: فحص الأسرار
        run: npm run secret-scan

      - name: البناء
        run: npm run build

      - name: حفظ التعديلات النظيفة إلى main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- src tests
          git rm -f -- APPLY_UI_NOTES_2026_09_08.py .github/workflows/apply-ui-notes-2026-09-08.yml MIZAN_UI_NOTES_TRIGGER.txt
          git fetch origin main
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse origin/main)"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "main changed during validation; refusing stale push"
            exit 1
          fi
          git config user.name "MIZAN CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(ui): apply competition setup and operations notes"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: تشغيل CI النهائي
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
