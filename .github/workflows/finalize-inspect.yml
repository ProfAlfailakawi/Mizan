name: Materialize final UX batch for review

on:
  push:
    branches: ['fix/final-ux-mfa-2026-09-08']
    paths: ['.github/workflows/finalize-inspect.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('APPLY_MIZAN_FINAL_UX_MFA_2026_09_08.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('nxt,n=re.subn(pattern,repl,text,count=1,flags=flags)','nxt,n=re.subn(pattern,lambda _m: repl,text,count=1,flags=flags)',1)
          s=s.replace("old=p.read_text(encoding='utf-8')","old=p.read_text(encoding='utf-8') if p.exists() else ''",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply existing batch to source
        run: python3 APPLY_MIZAN_FINAL_UX_MFA_2026_09_08.py
      - name: Persist materialized source for inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: materialize final UX batch for inspection'
          git push origin HEAD
