name: Apply and validate final MIZAN requirements

on:
  push:
    branches: ['fix/final-ux-mfa-2026-09-08']
    paths: ['.github/workflows/finalize-inspect.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - name: Install exactly from lockfile
        run: npm ci
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib/brand-assets.ts
          python3 - <<'PY'
          from pathlib import Path
          # Arabic guard: all rendered text nodes are normalized to Latin 0-9 first.
          p=Path('src/components/design-system/ArabicInterfaceGuard.tsx');s=p.read_text(encoding='utf-8')
          if "from '../../lib/input-validation'" not in s:
              s=s.replace("import {COUNTRIES} from '../../lib/countries';","import {COUNTRIES} from '../../lib/countries';\nimport {toAsciiDigits} from '../../lib/input-validation';",1)
          old="function localizeText(raw:string){const trimmed=raw.trim();if(!trimmed)return raw;const exact=LOOKUP[trimmed];if(exact)return raw.replace(trimmed,exact);let next=localizeTokens(raw);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}"
          new="function localizeText(raw:string){const normalized=toAsciiDigits(raw);const trimmed=normalized.trim();if(!trimmed)return normalized;const exact=LOOKUP[trimmed];if(exact)return normalized.replace(trimmed,exact);let next=localizeTokens(normalized);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('ArabicInterfaceGuard localizeText anchor missing')
          p.write_text(s,encoding='utf-8')

          # Universal desktop support.
          p=Path('src/components/layout/Header.tsx');s=p.read_text(encoding='utf-8')
          old="      {!superAdmin&&<LiveSupportControl/>}";new="      <LiveSupportControl/>"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Header LiveSupportControl anchor missing')
          p.write_text(s,encoding='utf-8')

          # The one-shot patch no longer owns those two compressed-file transformations.
          p=Path('tools/finalize_requirements_2026_09_09.py');s=p.read_text(encoding='utf-8')
          a=s.index('# Western digits are normalized centrally');b=s.index('# System owns FairDraw initiation',a)
          s=s[:a]+"# Western digits and universal support are applied directly by validation workflow.\n\n"+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 tools/finalize_requirements_2026_09_09.py
          # Normalize legacy assertions and the generated final contract against the adopted design.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('tests/competition-scoped-identity-onboarding.test.ts');s=p.read_text(encoding='utf-8')
          s=re.sub(r'assert\.match\(comp,/IdentityGovernance competitionId=\\\{competition\\\.id\\\}/\);',r'assert.doesNotMatch(comp,/IdentityGovernance competitionId=\\{competition\\.id\\}/);',s)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/product-hardening-phase-a.test.ts');s=p.read_text(encoding='utf-8')
          s=re.sub(r'assert\.match\(id,/Pause/\);\s*assert\.match\(id,/reissue-qr/\)',r'assert.match(id,/Pause/);assert.doesNotMatch(id,/reissue-qr/)',s)
          p.write_text(s,encoding='utf-8')
          p=Path('tests/final-requirements-2026-09-09.test.ts');s=p.read_text(encoding='utf-8')
          s=s.replace("assert.match(guard,/let out = toAsciiDigits\\(raw\\)/);","assert.match(guard,/toAsciiDigits\\(raw\\)/);")
          s=s.replace("assert.match(seed,/SEED_FEATURE_FLAGS: FeatureFlagRecord\\[\\] = \\[\\]/);","assert.match(seed,/SEED_FEATURE_FLAGS\\s*:\\s*FeatureFlagRecord\\[\\]\\s*=\\s*\\[\\s*\\]/);")
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'doesNotMatch(comp,/IdentityGovernance' tests/competition-scoped-identity-onboarding.test.ts
          grep -q 'doesNotMatch(id,/reissue-qr/' tests/product-hardening-phase-a.test.ts
          test -f src/lib/brand-assets.ts
      - name: Secret scan
        run: npm run secret-scan
      - name: Source audit
        run: npm run source-audit
      - name: TypeScript lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Arabic audit
        run: npm run arabic:audit
      - name: Production build
        run: npm run build
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
      - name: Guard final source contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "readAsDataURL\|new FileReader" src/components/admin/CompetitionOverview.tsx src/components/admin/TenantBrandStudio.tsx
          ! grep -n "Participant initiates the question draw\|المتسابق يبدأ سحب سؤاله" src/components/admin/CompetitionOverview.tsx
          grep -q "toAsciiDigits(raw" src/components/design-system/ArabicInterfaceGuard.tsx
          grep -q "uploadCompetitionLogo" src/components/admin/CompetitionOverview.tsx
          grep -q "deleteCompetitionLogo" src/components/admin/CompetitionOverview.tsx
          grep -q "BRAND_SCOPE_NOT_ALLOWED" server.ts
          grep -q "async deleteObject" server/r2-private.ts
          grep -q "<LiveSupportControl/>" src/components/layout/Header.tsx
          grep -q "SEED_FEATURE_FLAGS: FeatureFlagRecord\[\] = \[\]" src/lib/seed-data.ts
      - name: Persist validated source on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- src server.ts server tests package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: complete final MIZAN UX security and operations requirements'
          git push origin HEAD
