name: Capture final UX test diagnostics

on:
  push:
    branches: ['fix/final-ux-mfa-2026-09-08']
    paths: ['.github/workflows/finalize-inspect.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Capture test output
        shell: bash
        run: |
          set +e
          mkdir -p tmp
          npm test > tmp/final-test-output.txt 2>&1
          code=$?
          echo "TEST_EXIT_CODE=$code" >> tmp/final-test-output.txt
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp/final-test-output.txt
          git commit -m 'chore: capture failing test diagnostics' || exit 0
          git push origin HEAD
