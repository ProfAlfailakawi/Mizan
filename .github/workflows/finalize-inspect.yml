name: Apply and validate final MIZAN requirements

on:
  push:
    branches: ['fix/final-ux-mfa-2026-09-08']
    paths: ['.github/workflows/finalize-inspect.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - name: Install exactly from lockfile
        run: npm ci
      - name: Apply source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_requirements_2026_09_09.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import { isTechnicalToken, localizeTechnicalToken } from '../../lib/ui-language';", "import {COUNTRIES} from '../../lib/countries';")
          s=s.replace("import { isTechnicalToken, localizeTechnicalToken } from '../../lib/ui-language';\\nimport { toAsciiDigits } from '../../lib/input-validation';", "import {COUNTRIES} from '../../lib/countries';\\nimport {toAsciiDigits} from '../../lib/input-validation';")
          s=s.replace("const localizeText = (raw: string) => {\\n  let out = raw;", "function localizeText(raw:string){const normalized=toAsciiDigits(raw);const trimmed=normalized.trim();if(!trimmed)return normalized;const exact=LOOKUP[trimmed];if(exact)return normalized.replace(trimmed,exact);let next=localizeTokens(normalized);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}")
          s=s.replace("const localizeText = (raw: string) => {\\n  let out = toAsciiDigits(raw);", "function localizeText(raw:string){const normalized=toAsciiDigits(raw);const trimmed=normalized.trim();if(!trimmed)return normalized;const exact=LOOKUP[trimmed];if(exact)return normalized.replace(trimmed,exact);let next=localizeTokens(normalized);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}")
          # The current guard is compressed to one function rather than the older multi-line helper.
          old="function localizeText(raw:string){const trimmed=raw.trim();if(!trimmed)return raw;const exact=LOOKUP[trimmed];if(exact)return raw.replace(trimmed,exact);let next=localizeTokens(raw);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}"
          if old in s:
              # Make the finalizer replace the actual current function.
              s=s.replace("    \"const localizeText = (raw: string) => {\\n  let out = raw;\",\n    \"const localizeText = (raw: string) => {\\n  let out = toAsciiDigits(raw);\",", "    old,\n    \"function localizeText(raw:string){const normalized=toAsciiDigits(raw);const trimmed=normalized.trim();if(!trimmed)return normalized;const exact=LOOKUP[trimmed];if(exact)return normalized.replace(trimmed,exact);let next=localizeTokens(normalized);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}\",")
          p.write_text(s,encoding='utf-8')
          PY
          # Apply direct guard normalization first; the one-shot patch then handles all other source files.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/design-system/ArabicInterfaceGuard.tsx');s=p.read_text(encoding='utf-8')
          if "from '../../lib/input-validation'" not in s:
              s=s.replace("import {COUNTRIES} from '../../lib/countries';","import {COUNTRIES} from '../../lib/countries';\nimport {toAsciiDigits} from '../../lib/input-validation';",1)
          old="function localizeText(raw:string){const trimmed=raw.trim();if(!trimmed)return raw;const exact=LOOKUP[trimmed];if(exact)return raw.replace(trimmed,exact);let next=localizeTokens(raw);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}"
          new="function localizeText(raw:string){const normalized=toAsciiDigits(raw);const trimmed=normalized.trim();if(!trimmed)return normalized;const exact=LOOKUP[trimmed];if(exact)return normalized.replace(trimmed,exact);let next=localizeTokens(normalized);for(const [pattern,value] of PHRASES)next=next.replace(pattern,value);return next}"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          # Remove the two obsolete Arabic-guard operations from the one-shot patch because they are applied above.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/finalize_requirements_2026_09_09.py');s=p.read_text(encoding='utf-8')
          a=s.index('# Western digits are normalized centrally')
          b=s.index('# Live support is a universal',a)
          s=s[:a]+"# Western digits are normalized centrally above by the workflow against the current guard.\n\n"+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 tools/finalize_requirements_2026_09_09.py
      - name: Secret scan
        run: npm run secret-scan
      - name: Source audit
        run: npm run source-audit
      - name: TypeScript lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Arabic audit
        run: npm run arabic:audit
      - name: Production build
        run: npm run build
      - name: Dependency high-severity audit
        run: npm audit --audit-level=high
      - name: Guard final source contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "readAsDataURL\|new FileReader" src/components/admin/CompetitionOverview.tsx src/components/admin/TenantBrandStudio.tsx
          ! grep -n "Participant initiates the question draw\|المتسابق يبدأ سحب سؤاله" src/components/admin/CompetitionOverview.tsx
          grep -q "toAsciiDigits(raw)\|toAsciiDigits(raw" src/components/design-system/ArabicInterfaceGuard.tsx
          grep -q "uploadCompetitionLogo" src/components/admin/CompetitionOverview.tsx
          grep -q "deleteCompetitionLogo" src/components/admin/CompetitionOverview.tsx
          grep -q "BRAND_SCOPE_NOT_ALLOWED" server.ts
          grep -q "async deleteObject" server/r2-private.ts
      - name: Persist validated source on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- src server.ts server tests package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No source changes to persist.'
            exit 0
          fi
          git commit -m 'fix: complete final MIZAN UX security and operations requirements'
          git push origin HEAD
