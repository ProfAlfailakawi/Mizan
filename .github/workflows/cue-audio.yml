name: PR255 fit-page hotfix

on:
  push:
    branches:
      - chatgpt/ui-recitation-polish-20260921

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/ui-recitation-polish-20260921
          fetch-depth: 0
      - name: Apply minimal Mushaf fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/judge/OfficialMushafSurface.tsx')
          s = p.read_text()
          old_figure = 'className="relative mx-auto flex max-h-[70vh] max-w-full items-start justify-center"'
          new_figure = 'className="relative mx-auto flex flex-col max-h-[70vh] max-w-full items-center justify-center"'
          old_img = 'className="mizan-mushaf-page block h-auto w-auto max-h-[70vh] max-w-full object-contain rounded-[2px] shadow-[0_10px_24px_rgba(0,0,0,.07)]"'
          new_img = 'className="mizan-mushaf-page block w-auto h-auto max-h-[70vh] max-w-full object-contain rounded-[2px] shadow-[0_10px_24px_rgba(0,0,0,.07)]"'
          if s.count(old_figure) != 1:
              raise SystemExit(f'figure contract mismatch: {s.count(old_figure)}')
          if s.count(old_img) != 1:
              raise SystemExit(f'image contract mismatch: {s.count(old_img)}')
          s = s.replace(old_figure, new_figure).replace(old_img, new_img)
          p.write_text(s)
          PY
          git show origin/main:.github/workflows/cue-audio.yml > .github/workflows/cue-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/judge/OfficialMushafSurface.tsx .github/workflows/cue-audio.yml
          git commit -m "fix(mushaf): preserve fit-page regression contract"
          git push origin HEAD:chatgpt/ui-recitation-polish-20260921
