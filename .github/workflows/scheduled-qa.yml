name: فحوصُ الجودة المجدولة — ما كان يُشغَّل باليد

# سبعةُ فحوصٍ كانت في المستودع ولا تعمل في أيّ سير عمل.
#
# وذلك أسوأ من ألّا تكون موجودة: تُكتب مرّة، ثم تُنسى، ثم تشيخ، ثم تنكسر بصمت، ثم
# يُكتشف أنها لم تعمل منذ شهور — وهي تطمئن بلا وجهٍ للطمأنينة. وقد شُغِّلت كلُّها
# باليد على `51d1d56` ونجحت، **لكنّ تشغيلًا يدويًّا على رأسٍ بعينه ليس جدولة**.
#
# فتُجدوَل هنا. ولا تدخل مسارَ الدفعات: فحصٌ يحتاج متصفّحًا وبناءً كاملًا يُبطّئ كلّ
# دفعةٍ حتى يُتحايل عليه، وهذه الفحوصُ موضوعُها المنتجُ المبنيُّ لا فرقُ الدفعة.
#
# ولا سرَّ في هذا الملفّ: كلُّها تعمل على بياناتٍ تجريبية وعلى ما يُبنى هنا.

on:
  schedule:
    # كل أحدٍ في الخامسة صباحًا بتوقيت UTC (أسبوعيًّا)، فوق التشغيل عند كل دفعٍ إلى main.
    - cron: '0 5 * * 0'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-scheduled-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── ما لا يحتاج متصفّحًا ────────────────────────────────────────────────────
  headless-checks:
    name: المصفوفة والجاهزية ويومُ التشغيل
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci

      # مصفوفةُ الإصدار هي مَن يحمل حكمَ الاكتمال (١١/٢٠ اليوم)، وبوّابةُ R2 تحمل
      # النزاهةَ وحدها. فخلطُهما هو ما صنع بوّابةً لا تخضرّ أبدًا.
      - name: مصفوفة إصدار العشرين
        run: npm run quran:release-matrix
      - name: جاهزية الذكاء القرآني
        run: npm run quran:readiness
      - name: يومُ التشغيل الكامل
        run: npm run qa:live-day

      # وفحصُ مطابقة محرّك التعرّف للعقد. ولا يحتاج محرّكًا حقيقيًّا: يُشغَّل على
      # المحرّك المرجعيّ في المستودع — وهو لا يتعرّف على شيء، وإنّما يحمل العقد.
      # والغرضُ أن يُشغَّل **الفاحصُ** نفسُه فلا يشيخ ويُنكسر بصمت، كما وقع لسبعةٍ قبله.
      - name: مطابقةُ محرّك التعرّف للعقد
        run: npm run quran:asr-conformance

  # ── ما يحتاج متصفّحًا ولا يحتاج خادمًا ──────────────────────────────────────
  browser-checks:
    name: الوثيقة المطبوعة ووضوحُ القاعة
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci
      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium

      # ويحتاجان البناءَ وإن لم يحتاجا خادمًا.
      #
      # كُتبت هذه الوظيفةُ أوّلَ مرّةٍ بلا بناء، على أن الفحصين «يبنيان صفحتَهما
      # بـ`setContent` فلا يحتاجان خادمًا» — وهو صحيحٌ في الخادم وخطأٌ في البناء: كلاهما
      # يقرأ ورقةَ أنماط المنتج نفسَها من `dist/assets/*.css`، وهي المقصودةُ بالقياس.
      # فسقطا في أوّل تشغيلٍ على `main` بلا ثانيةٍ واحدة: `readdirSync('dist/assets')`
      # يرمي قبل أن يُفتح متصفّح.
      #
      # وفحصتُ التبعيةَ الواحدةَ وافترضتُ الأخرى. فصار الشرطُ مُشتقًّا لا محفوظًا:
      # `tests/scheduled-qa-workflow.test.ts` يُسقط الفحصَ إن شُغِّل في وظيفةٍ فحصٌ يقرأ
      # `dist/` بلا `npm run build` قبله.
      - name: البناء
        run: npm run build

      - name: الوثيقة العربية على الورق
        run: npm run qa:print-document
      - name: وضوحُ الشاشة من آخر القاعة
        run: npm run qa:venue-legibility

      - name: احفظ المخرجات عند الفشل
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: qa-browser-output
          path: |
            dist/print-document-qa
          if-no-files-found: ignore

  # ── بابُ المتسابق الأماميّ: خادمٌ حقيقيّ ومحاكي Firestore ───────────────────
  #
  # قسمُ التسجيل في `qa:scope-visual` كان يُتخطّى باسمه على خادم المعاينة الساكن، لأن
  # الرابطَ العامّ **يُعيد الجلبَ من الخادم دائمًا ولا يقبل نسخةَ المتصفّح** — وهو مقصودٌ
  # ومكتوبٌ في `src/App.tsx`: وإلّا نجحت التجربةُ على جهاز الإدارة وحده وفشلت عند المتسابق.
  #
  # فالتخطّي كان صادقًا، لكنّه يترك بابَ المتسابق الأماميَّ بلا فحصٍ في متصفّح. وهنا
  # يُشغَّل على خادمٍ حقيقيٍّ ومحاكي Firestore: النموذجُ، وقاعدةُ الفئة، و**اختيارُ الرواية
  # صراحةً** قبل المتابعة.
  public-registration:
    name: التسجيل العام على خادمٍ حقيقيّ
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci
      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium
      - name: جافا للمحاكي
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: البناء
        run: npm run build

      # الزرعُ يرفض العملَ بلا `FIRESTORE_EMULATOR_HOST`، فلا يلمس Firestore حقيقيًّا بحال.
      - name: التسجيل من أوّله إلى المراجعة
        run: npm run qa:public-registration

      - name: احفظ اللقطات عند الفشل
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: qa-public-registration
          path: dist/scope-visual-qa
          if-no-files-found: ignore

  # ── ما يحتاج متصفّحًا وخادمًا حقيقيًّا ──────────────────────────────────────
  #
  # كانت هذه الوظيفةُ تقود خادمَ معاينةٍ ساكنًا (`vite preview`). ومنذ الصندوق المعزول
  # (#408) صار دخولُ العرض يطلب `POST /api/demo/enter` أوّلًا، والخادمُ الساكن يردّ 404 —
  # والواجهةُ تقرأ 404 «العرضُ مُطفأ في هذا النشر» عن حقّ، فلا تدخل. فسقطت الفحوصُ الثلاثة
  # قبل أن تبلغ شاشةً واحدة. والإصلاحُ في البيئة لا في المنتج: يُشغَّل الخادمُ الحقيقيّ
  # (`dist/server.cjs`) على محاكي Firestore بمسابقةٍ مزروعة — كما في `qa-public-registration.sh`
  # — فيعمل الدخولُ، ويعمل قسمُ التسجيل بدل أن يُتخطّى. ولا يلمس شيءٌ هنا Firestore حقيقيًّا.
  product-surface:
    name: سطحُ المنتج ويومُ المسابقة في متصفّح
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_PROJECT_ID: mizan-qa-surface
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci
      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium
      - name: جافا للمحاكي
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: البناء
        run: npm run build

      # الانتظارُ بالاستجابة لا بالتوقيت: رقمٌ ثابت يمرّ أحيانًا ويسقط أحيانًا.
      - name: محاكي Firestore ومسابقةٌ مزروعة
        run: |
          npx firebase emulators:start --only firestore --project "$FIREBASE_PROJECT_ID" > /tmp/mizan-qa-emulator.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS "http://$FIRESTORE_EMULATOR_HOST/" > /dev/null 2>&1; then echo "المحاكي جاهز بعد ${i}ث"; break; fi
            sleep 1
          done
          curl -fsS "http://$FIRESTORE_EMULATOR_HOST/" > /dev/null || { echo "EMULATOR_DID_NOT_START"; tail -30 /tmp/mizan-qa-emulator.log; exit 1; }
          npm run -s qa:seed-public

      - name: تشغيل الخادم الحقيقيّ
        run: |
          PORT=4173 node dist/server.cjs > /tmp/mizan-qa-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/api/health > /dev/null; then echo "الخادم جاهز بعد ${i}ث"; exit 0; fi
            sleep 1
          done
          echo "SERVER_DID_NOT_START: الخادم لم يستجب خلال ٦٠ ثانية"; tail -30 /tmp/mizan-qa-server.log; exit 1

      - name: سطحُ النطاق والأسئلة في ثلاثة مقاسات
        run: npm run qa:scope-visual -- --base=http://127.0.0.1:4173 --comp=comp-qa-surface
      - name: يومُ المسابقة من الموضع الأول إلى قفل التقييم
        run: npm run qa:competition-day -- --base=http://127.0.0.1:4173
      # وثامنٌ لم يكن في القائمة أصلًا: كشفه الحارسُ حين اشتُقّت القائمةُ من
      # `package.json` بدل أن تُكتب بيد. ويقيس ما لا يقيسه غيرُه: تمدّدَ الشاشات على
      # عرض هاتفٍ ٣٩٠ بكسل.
      - name: لا تمدّد أفقيّ على الهاتف
        run: npm run qa:phone-overflow -- --base=http://127.0.0.1:4173

      - name: احفظ اللقطات وسجلَّ الخادم عند الفشل
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: qa-surface-screenshots
          path: |
            dist/scope-visual-qa
            dist/competition-day-qa
            /tmp/mizan-qa-server.log
          if-no-files-found: ignore

  # تاسعٌ، وهو الوحيدُ الذي يقيس **سلوكًا زمنيًّا**: شاشةُ «المصحفُ يسمعك» تُشغَّل
  # بميكروفونٍ حقيقيّ (جهازُ Chromium الصوريّ) على شبكةٍ تتلكّأ بأمر.
  #
  # وثمانيةُ عيوبٍ وُجدت في تلك الشاشة كانت كلُّها زمنيّة: تعليقٌ، وترتيبُ وصول،
  # وتركيبٌ يتكرّر، وطلبٌ يعود بعد أوانه. ولم يرَ منها بناءٌ ولا تصييرٌ إلى نصّ ولا
  # اختبارُ عقدةٍ شيئًا — رآها أوّلُ تشغيلٍ في متصفّح. ولا يدخل مسارَ الدفعات: يحتاج
  # متصفّحًا ويستغرق دقيقتين، وموضوعُه سلوكُ الشاشة لا فرقُ الدفعة.
  #
  # ولا بناءَ هنا ولا خادمَ معاينة: المشحنُ يرفع خادمَ تطويرٍ خاصًّا به ويقود الشاشةَ
  # نفسَها. والوجوهُ والكلماتُ تُقرأ من حزمة الرواية، فلا نصَّ قرآنيًّا مُختلَقًا —
  # والمُصطنَعُ سلوكُ الشبكة وحدَه.
  face-listens:
    name: المصحفُ يسمعك — تلاواتٌ بميكروفونٍ حقيقيّ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci
      - name: تثبيت Chromium
        run: npx playwright install --with-deps chromium
      - name: تلاواتٌ — سليمةٌ، ومقلوبةُ الوصول، ومعلّقة، وساقطة، وبوّابةٌ مفتوحةٌ ومغلقة
        run: npm run qa:face-listens
