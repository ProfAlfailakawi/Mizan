name: إصلاح دخول السوبر أدمن

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-super-admin-access.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-super-admin-access-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: إصلاح bootstrap السوبر أدمن بدون إضعاف بقية الأدوار
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str, label: str):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: anchor not found for {label}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Server: a Firebase-signed super_admin claim is platform-global and must not be
          # rejected merely because it has no tenant org_id. Tenant roles still require org_id.
          replace_one(
              'server.ts',
              "const identityFromBase=(base:{uid:string;email?:string;raw:Record<string,unknown>}):ServerIdentity|null=>{const managed=identityGovernance?.identityForUid(base.uid);if(managed){if(managed.grant.role==='scientific_admin')return null;return {uid:base.uid,email:base.email,role:managed.grant.role,organizationId:managed.grant.organizationId,competitionId:managed.grant.competitionId}}const role=String(base.raw.role||'') as GovernanceRole;const organizationId=String(base.raw.org_id||'');if(!role||!organizationId||role==='scientific_admin')return null;return {uid:base.uid,email:base.email,role,organizationId,competitionId:base.raw.competition_id?String(base.raw.competition_id):undefined}};",
              "const platformOwnerOrganizationId='__platform__';\n  const identityFromBase=(base:{uid:string;email?:string;raw:Record<string,unknown>}):ServerIdentity|null=>{const managed=identityGovernance?.identityForUid(base.uid);if(managed){if(managed.grant.role==='scientific_admin')return null;return {uid:base.uid,email:base.email,role:managed.grant.role,organizationId:managed.grant.organizationId|| (managed.grant.role==='super_admin'?platformOwnerOrganizationId:''),competitionId:managed.grant.competitionId}}const role=String(base.raw.role||'') as GovernanceRole;const claimedOrganizationId=String(base.raw.org_id||'');const organizationId=claimedOrganizationId||(role==='super_admin'?platformOwnerOrganizationId:'');if(!role||!organizationId||role==='scientific_admin')return null;return {uid:base.uid,email:base.email,role,organizationId,competitionId:base.raw.competition_id?String(base.raw.competition_id):undefined}};",
              'platform owner org fallback',
          )

          # The live build deliberately has VITE_REQUIRE_MFA_FOR_SENSITIVE=false during the
          # current bootstrap/testing phase. The dedicated owner setting, when supplied, wins;
          # otherwise inherit the existing global switch instead of silently forcing MFA.
          replace_one(
              'server.ts',
              "const ownerMfaRequired=process.env.MIZAN_REQUIRE_MFA_FOR_SUPER_ADMIN!=='false';",
              "const ownerMfaSetting=process.env.MIZAN_REQUIRE_MFA_FOR_SUPER_ADMIN;\n  const ownerMfaRequired=ownerMfaSetting===undefined?process.env.MIZAN_REQUIRE_MFA_FOR_SENSITIVE==='true':ownerMfaSetting==='true';",
              'server owner MFA fallback',
          )

          replace_one(
              'src/lib/useMizanAuth.ts',
              "/** Tenant staff MFA is opt-in; the platform owner remains protected by default. */\nconst OPTIONAL_STAFF_MFA_ROLES: Role[] = [",
              "/** Platform owner is global; tenant-scoped roles still require a real organization id. */\nconst PLATFORM_OWNER_ORGANIZATION_ID = '__platform__';\n\n/** Tenant staff MFA is opt-in. Owner MFA follows its dedicated flag when supplied, otherwise the shared bootstrap flag. */\nconst OPTIONAL_STAFF_MFA_ROLES: Role[] = [",
              'client platform owner constant',
          )

          replace_one(
              'src/lib/useMizanAuth.ts',
              "        const claimIdentity: ResolvedIdentity = {\n          role: String(token.claims.role || '') as Role,\n          organizationId: String(token.claims.org_id || ''),\n          competitionId: token.claims.competition_id ? String(token.claims.competition_id) : undefined,\n          serverManaged: false,\n        };",
              "        const claimRole = String(token.claims.role || '') as Role;\n        const claimedOrganizationId = String(token.claims.org_id || '');\n        const claimIdentity: ResolvedIdentity = {\n          role: claimRole,\n          organizationId: claimedOrganizationId || (claimRole === 'super_admin' ? PLATFORM_OWNER_ORGANIZATION_ID : ''),\n          competitionId: token.claims.competition_id ? String(token.claims.competition_id) : undefined,\n          serverManaged: false,\n        };",
              'client owner org fallback',
          )

          replace_one(
              'src/lib/useMizanAuth.ts',
              "        const ownerMfaRequired = import.meta.env.VITE_REQUIRE_MFA_FOR_SUPER_ADMIN !== 'false';",
              "        const ownerMfaSetting = import.meta.env.VITE_REQUIRE_MFA_FOR_SUPER_ADMIN;\n        const ownerMfaRequired = ownerMfaSetting === undefined\n          ? import.meta.env.VITE_REQUIRE_MFA_FOR_SENSITIVE === 'true'\n          : ownerMfaSetting === 'true';",
              'client owner MFA fallback',
          )

          # Keep the reusable Firebase claim validator aligned with the same platform-owner rule.
          replace_one(
              'server/firebase-auth.ts',
              "  const base=validateFirebaseBaseClaims(payload,projectId,nowSeconds);const role=String(payload.role||''),organizationId=String(payload.org_id||'');\n  if(!role||!organizationId)throw new Error('FIREBASE_MIZAN_CLAIMS_REQUIRED');",
              "  const base=validateFirebaseBaseClaims(payload,projectId,nowSeconds);const role=String(payload.role||''),claimedOrganizationId=String(payload.org_id||''),organizationId=claimedOrganizationId||(role==='super_admin'?'__platform__':'');\n  if(!role||!organizationId)throw new Error('FIREBASE_MIZAN_CLAIMS_REQUIRED');",
              'validator owner org fallback',
          )

          # Regression test: owner can be platform-global; tenant roles still fail closed.
          p=Path('tests/firebase-auth-claims.test.ts')
          text=p.read_text(encoding='utf-8')
          needle="test('server-side MFA evidence is read from the verified Firebase token, not from client UI state',()=>{"
          test_block="""test('platform super admin may be global while tenant roles still require org scope',()=>{\n const owner=validateFirebaseClaims({...base,sub:'owner-1',role:'super_admin',org_id:''},'mizan-prod',now);\n assert.equal(owner.role,'super_admin');\n assert.equal(owner.organizationId,'__platform__');\n assert.throws(()=>validateFirebaseClaims({...base,sub:'judge-no-org',role:'judge',org_id:''},'mizan-prod',now),/CLAIMS_REQUIRED/);\n});\n\n"""
          if test_block not in text:
              if needle not in text: raise SystemExit('tests/firebase-auth-claims.test.ts: insert anchor missing')
              p.write_text(text.replace(needle,test_block+needle,1),encoding='utf-8')

          # Static regression around the exact login dead-end fixed here.
          p=Path('tests/super-admin-bootstrap-access.test.ts')
          p.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\ntest('super-admin bootstrap remains global and respects the configured MFA switch',()=>{\n const client=fs.readFileSync('src/lib/useMizanAuth.ts','utf8');\n const server=fs.readFileSync('server.ts','utf8');\n assert.match(client,/PLATFORM_OWNER_ORGANIZATION_ID = '__platform__'/);\n assert.match(client,/claimRole === 'super_admin' \? PLATFORM_OWNER_ORGANIZATION_ID/);\n assert.match(server,/role==='super_admin'\?platformOwnerOrganizationId/);\n assert.match(client,/VITE_REQUIRE_MFA_FOR_SENSITIVE === 'true'/);\n assert.match(server,/MIZAN_REQUIRE_MFA_FOR_SENSITIVE==='true'/);\n});\n""",encoding='utf-8')
          PY

      - name: فحص الأنواع
        run: npm run lint

      - name: الاختبارات
        run: npm test

      - name: تدقيق المصدر والأسرار
        run: npm run source-audit

      - name: تدقيق الواجهة العربية
        run: npm run arabic-ui-audit

      - name: البناء
        run: npm run build

      - name: حفظ الإصلاح في main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git add -- server.ts server/firebase-auth.ts src/lib/useMizanAuth.ts tests/firebase-auth-claims.test.ts tests/super-admin-bootstrap-access.test.ts
          if git diff --cached --quiet; then
            echo 'changed=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved while checks were running; refusing stale push.'
            exit 1
          fi
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(auth): restore platform super-admin access'
          git push origin HEAD:main
          echo 'changed=1' >> "$GITHUB_OUTPUT"

      - name: تشغيل CI على الإصلاح
        if: steps.persist.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
