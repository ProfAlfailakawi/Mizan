name: إكمال ميزان — المرحلة C النهائية

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_FINAL_CLEANUP_PHASE_C_2026_09_08.py'
      - '.github/workflows/final-cleanup-phase-c.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-final-cleanup-phase-c
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: إعداد Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت الاعتمادات
        run: npm ci
      - name: تطبيق الإكمال النهائي
        run: python3 APPLY_FINAL_CLEANUP_PHASE_C_2026_09_08.py
      - name: تنظيف كل الأسطح النشطة المتبقية وإصلاح العقود المتأثرة
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def rw(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for old,new in pairs: s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          rw('src/lib/arabic-labels.ts', [("scientific_admin:'المسؤول العلمي',", '')])
          rw('src/lib/cloud-sync.ts', [("reviews: ['head_judge', 'scientific_admin'],", "reviews: ['head_judge'],"),(" , 'scientific_admin', 'auditor'", " , 'auditor'"),(", 'scientific_admin', 'auditor'", ", 'auditor'"),("quran_sources: [...ADMIN, 'scientific_admin'],", "quran_sources: ['super_admin'],")])
          rw('src/components/admin/IntegrityProtocolLab.tsx', [("approve:s.currentUser.role==='scientific_admin'", "approve:s.currentUser.role==='super_admin'"),("const allowed=s.currentUser.role==='scientific_admin';", "const allowed=s.currentUser.role==='super_admin';"),("هذه الوظيفة للمسؤول العلمي فقط.", "هذه الوظيفة لمدير المنصة فقط."),("Scientific-admin authority is required.", "Platform administrator authority is required.")])
          rw('src/components/public/CeremonyView.tsx', [("['broadcast_operator','comp_admin','org_admin','scientific_admin'].includes(currentUser.role)", "['head_judge','comp_admin','org_admin'].includes(currentUser.role)"),("a=>a.actorRole==='scientific_admin'", "a=>a.actorRole==='head_judge'"),("label={ar?'علمي':'Scientific'}", "label={ar?'رئيس التحكيم':'Head Judge'}")])
          rw('src/components/design-system/ArabicInterfaceGuard.tsx', [(" scientific_admin:'الإدارة العلمية',", '')])
          rw('tests/trust-protocol.test.ts', [("scientific_admin", "head_judge")])
          rw('src/lib/store.ts', [("if(!globalState.currentUser.role==='org_admin')", "if(globalState.currentUser.role!=='org_admin')")])
          rw('tests/competition-scoped-identity-onboarding.test.ts', [("العودة إلى إعدادات الجهة", "العودة إلى مسابقات الجهة")])
          PY
      - name: حفظ تشخيص الدور المتقاعد
        run: |
          mkdir -p diagnostics
          grep -Rsn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' scientific_admin src server server.ts tests > diagnostics/scientific-admin.txt || true
      - name: تدقيق حذف الدور القديم من الأسطح النشطة
        id: retired
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if grep -Rsn --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' scientific_admin src server server.ts \
             | grep -v '^server/identity-governance.ts:' \
             | grep -v '^src/lib/store.ts:' | tee diagnostics/retired-active.txt; then
            echo 'Unexpected active retired-role reference found.'
            exit 1
          fi
          test "$(grep -o scientific_admin server/identity-governance.ts | wc -l)" -eq 1
          test "$(grep -o scientific_admin src/lib/store.ts | wc -l)" -eq 1
      - name: فحص الأنواع
        id: lint
        continue-on-error: true
        shell: bash
        run: npm run lint > diagnostics/lint.txt 2>&1
      - name: الاختبارات
        id: tests
        continue-on-error: true
        shell: bash
        run: npm test > diagnostics/tests.txt 2>&1
      - name: تدقيق المصدر
        id: source
        continue-on-error: true
        shell: bash
        run: npm run source-audit > diagnostics/source-audit.txt 2>&1
      - name: تدقيق العربية
        id: arabic
        continue-on-error: true
        shell: bash
        run: npm run arabic-ui-audit > diagnostics/arabic-ui-audit.txt 2>&1
      - name: فحص الأسرار
        id: secrets
        continue-on-error: true
        shell: bash
        run: npm run secret-scan > diagnostics/secret-scan.txt 2>&1
      - name: البناء
        id: build
        continue-on-error: true
        shell: bash
        run: npm run build > diagnostics/build.txt 2>&1
      - name: رفع نتائج جميع البوابات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-gate-diagnostics
          path: diagnostics
          retention-days: 1
      - name: فرض خضرة جميع البوابات
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.retired.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.source.outcome }}' = success
          test '${{ steps.arabic.outcome }}' = success
          test '${{ steps.secrets.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
      - name: حفظ الملفات الفعلية في main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(
            src/types/index.ts
            src/lib/permissions.ts
            src/lib/useMizanAuth.ts
            src/lib/arabic-labels.ts
            src/lib/cloud-sync.ts
            src/components/admin/CompetitionOverview.tsx
            src/components/admin/IdentityGovernance.tsx
            src/components/admin/IntegrityProtocolLab.tsx
            src/components/design-system/RoleSwitcher.tsx
            src/components/design-system/ArabicInterfaceGuard.tsx
            src/components/public/CeremonyView.tsx
            src/lib/ui-language.ts
            server/identity-governance.ts
            server.ts
            src/lib/store.ts
            src/lib/seed-data.ts
            src/components/admin/RolePortals.tsx
            src/components/layout/Header.tsx
            src/App.tsx
            tests/user-notes-2026-09-08.test.ts
            tests/trust-protocol.test.ts
            tests/competition-scoped-identity-onboarding.test.ts
            tests/final-cleanup-phase-c.test.ts
          )
          git add -- "${TARGETS[@]}"
          git rm -f -- APPLY_FINAL_CLEANUP_PHASE_C_2026_09_08.py .github/workflows/final-cleanup-phase-c.yml
          git diff --cached --check
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main changed while final checks were running; refusing stale push.'
            exit 1
          fi
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: retire legacy authority and finish product cleanup'
          git push origin HEAD:main
          echo 'materialized=1' >> "$GITHUB_OUTPUT"
      - name: تشغيل الفحص النهائي
        if: steps.persist.outputs.materialized == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
