name: فحص ميزان — لا نشر فوق فحص أحمر

# مسابقة بنتائج ودرجات تحكيم: كل دفعة تُفحص قبل أن تصل الإنتاج.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      # npm ci يفشل إن خرج package-lock.json عن التزامن مع package.json.
      # حدث ذلك مرتين: في 4 و5 سبتمبر 2026، وفي المرتين سقط القفل من 694 إلى
      # 400 مُدخلاً — 295 حزمة، العدد نفسه — بينما package.json لم يتغيّر.
      # تطابق العدد يعني سبباً واحداً متكرراً لا مصادفة: القفل يُعاد توليده من
      # تثبيت لا يشمل كل الشجرة (مثل npm install --omit=dev أو NODE_ENV=production)،
      # فيُكتب ناقصاً. تجنّبه بتوليد القفل من تثبيت كامل قبل الدفع.
      # هذه الخطوة تمسكه قبل النشر.
      - name: تثبيت من ملف القفل
        run: npm ci

      - name: فحص الأنواع
        run: npm run lint

      - name: الاختبارات
        run: npm test

      # عقد المنفذ يُفحص هنا، لا في الاختبارات وحدها.
      #
      # Cloud Run يحقن PORT ولا يتفاوض عليه. ومنفذٌ مثبَّت في الشيفرة يعني أن
      # التطبيق يستمع في موضع والمنصّة تطرق موضعًا آخر: يسقط فحص الصحة ويُردّ
      # النشر، ويبقى الموقع على نسخته القديمة بلا خطأ يدلّ على السبب. وقد وقع.
      #
      # ويحرسه اليوم `tests/server-runtime-config.test.ts` وحارسٌ في Dockerfile.
      # لكن أيًّا منهما لا يحرس نفسه: تعديلٌ يمسّ `server.ts` و`Dockerfile` ويحذف
      # الاختبار في الدفعة نفسها يمرّ بلا أن يفشل شيء — لأن الاختبار الذي كان
      # سيمسكه لم يعد موجودًا. وهذا ما تقترحه مزامنة Google AI Studio بالضبط:
      # تعديل الملفين وحذف الاختبار معًا.
      #
      # فيُعاد الفحص هنا مستقلًّا عن كليهما. وهو ليس حصينًا — من يعدّل هذا الملف
      # يزيله — لكنه خارج ما تمسّه تلك المزامنة، فيمسك الحالة التي وقعت فعلًا.
      - name: عقد المنفذ — الخدمة تستمع حيث تطرق المنصّة
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error title=عقد المنفذ::$1"; exit 1; }

          grep -qE 'const PORT\s*=[^;]*process\.env\.PORT' server.ts \
            || fail "server.ts لا يقرأ PORT من البيئة — النشر سيسقط في فحص الصحة."
          grep -qE 'const PORT\s*=\s*[0-9]+\s*;' server.ts \
            && fail "server.ts يثبّت المنفذ في الشيفرة." || true
          grep -qE '^EXPOSE[[:space:]]+[0-9]+' Dockerfile \
            || fail "Dockerfile لا يعلن المنفذ الذي يخدمه."
          test -f tests/server-runtime-config.test.ts \
            || fail "اختبار عقد المنفذ حُذف. إن كان الحذف مقصودًا فانقل حراسته أولًا."

          echo "عقد المنفذ سليم: server.ts يقرأ PORT، وDockerfile يعلنه، والاختبار قائم."

      # محاكي Firestore يعمل على JVM، و firebase-tools 15 لا يقبل جافا قبل ٢١.
      # وصورةُ المُشغِّل تحمل جافا لا نحن اخترناها، فقد تتقدّم وتتأخّر بلا علمنا —
      # وقد سقطت الخطوة التالية أولَ تشغيلٍ لها بهذا بعينه. فتُثبَّت النسخة هنا
      # صراحةً، ليكون الحارس مستقلًّا عمّا تحمله الصورة اليوم.
      - name: جافا للمحاكي
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # قواعد Firestore هي الحاجز الأخير بين نطاق متسابقٍ ومن لا حقّ له فيه، وهي
      # الشيء الوحيد في هذا المستودع الذي لا يكفي فيه فحصُ الشيفرة: تُقيَّم على
      # خادمٍ لا نملكه. فتُشغَّل على المحاكي هنا — بلا اعتماد، وبلا لمس قاعدةٍ حيّة.
      # وبلا هذه الخطوة تبقى فحوصها محليةً تتخطّى نفسها في CI، فيمرّ انكسارُ قاعدةٍ
      # أمنية بلا أن يوقفه أحد: حارسٌ لا يحرس.
      - name: قواعد Firestore والمُهايئ (على المحاكي)
        run: npm run qa:firestore-rules

      - name: تدقيق المصدر والأسرار
        run: npm run source-audit

      - name: تدقيق الواجهة العربية
        run: npm run arabic-ui-audit

      - name: البناء
        run: npm run build

      # Cloud Run لا يشغّل ناتج npm run build مباشرة؛ يشغّل صورة Dockerfile.
      # لذلك لا يكفي أن ينجح Vite/TypeScript: نبني نفس صورة الإنتاج قبل السماح للنشر.
      - name: بناء صورة Cloud Run الفعلية
        shell: bash
        run: |
          set -o pipefail
          docker build --tag "mizan-ci:${GITHUB_SHA}" . 2>&1 | tee docker-build.log

      # يبقى سجل Docker متاحاً عند الفشل حتى يكون سبب الانكسار مرئياً ولا نعالج بالتخمين.
      - name: حفظ سجل Docker عند الفشل
        if: ${{ failure() && hashFiles('docker-build.log') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: cloud-run-docker-build-${{ github.sha }}
          path: docker-build.log
          if-no-files-found: ignore
          retention-days: 3
