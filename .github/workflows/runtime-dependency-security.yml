name: أمن اعتماديات الإنتاج

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-runtime-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت من ملف القفل
        run: npm ci
      - name: منع الثغرات العالية/الحرجة في اعتماديات وقت التشغيل
        run: npm audit --omit=dev --audit-level=high
