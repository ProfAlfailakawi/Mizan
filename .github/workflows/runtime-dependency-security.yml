name: أمن اعتماديات الإنتاج

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizan-runtime-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      # لا نُسقط peer من شجرة npm قبل audit: npm 10 قد يرسل عندها شجرةً ناقصةً إلى
      # quick-audit endpoint فيردّ 400 "Invalid package tree"، وهو عطلٌ في القياس لا
      # تقريرُ ثغرة. نثبّت الشجرة المقفلة كاملةً، ثم نجعل audit نفسه يستبعد dev وpeer.
      # هكذا يبقى الحكم على اعتماديات runtime فقط، لكن مدخل npm audit صالح ومتّسق.
      - name: تثبيت الشجرة المقفلة الكاملة لتدقيق صالح
        run: npm ci
      - name: منع الثغرات العالية/الحرجة في اعتماديات وقت التشغيل الفعلية
        run: npm audit --omit=dev --omit=peer --audit-level=high
