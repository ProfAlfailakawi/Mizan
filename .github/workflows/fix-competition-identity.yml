name: إصلاح الهوية حسب المسابقة وتفعيل QR

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_COMPETITION_IDENTITY_2026_09_08.py'
      - '.github/workflows/fix-competition-identity.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-competition-identity-fix
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: إعداد Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - name: تثبيت الاعتمادات
        run: npm ci

      - name: إصلاح حارس تحويل identityForUid في الـmaterializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('APPLY_COMPETITION_IDENTITY_2026_09_08.py')
          text=p.read_text(encoding='utf-8')
          old='old_tail_start=t.find("\\n    const s=this.read();this.cleanup(s);this.write(s);const account=s.accounts.find", t.find("identityForUid(uid:string,competitionId?:string)"))'
          new='sig=t.find("  identityForUid(uid:string,competitionId?:string){")\nnew_close=t.find("\\n  }",sig)+4\nold_tail_start=t.find("\\n    const s=this.read();this.cleanup(s);this.write(s);const account=s.accounts.find", new_close)'
          if old not in text:
              raise SystemExit('Expected materializer guard anchor not found; refusing partial repair.')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: تطبيق تفعيل QR والعزل حسب المسابقة
        run: python3 APPLY_COMPETITION_IDENTITY_2026_09_08.py

      - name: فحص الأنواع
        run: npm run lint

      - name: الاختبارات
        run: npm test

      - name: تدقيق المصدر والأسرار
        run: npm run source-audit

      - name: تدقيق الواجهة العربية
        run: npm run arabic-ui-audit

      - name: البناء
        run: npm run build

      - name: حفظ الإصلاح في main
        id: persist
        shell: bash
        run: |
          set -euo pipefail

          TARGETS=(
            "src/components/auth/AuthPortal.tsx"
            "src/components/admin/RolePortals.tsx"
            "src/components/admin/CompetitionOverview.tsx"
            "src/App.tsx"
            "src/components/admin/IdentityGovernance.tsx"
            "server/identity-governance.ts"
            "server.ts"
            "tests/competition-scoped-identity-onboarding.test.ts"
          )

          git add -- "${TARGETS[@]}"
          git rm -- APPLY_COMPETITION_IDENTITY_2026_09_08.py .github/workflows/fix-competition-identity.yml

          if git diff --cached --quiet; then
            echo "materialized=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin main
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse origin/main)"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "main changed while checks were running; refusing stale push."
            exit 1
          fi

          git config user.name "MIZAN CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(identity): scope access per competition and finish QR onboarding"
          git push origin HEAD:main
          echo "materialized=1" >> "$GITHUB_OUTPUT"

      - name: تشغيل CI على الإصلاح النهائي
        if: steps.persist.outputs.materialized == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
