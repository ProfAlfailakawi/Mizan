name: تثبيت صلابة ميزان — المرحلة A

on:
  push:
    branches: [main]
    paths:
      - 'APPLY_HARDENING_PHASE_A_2026_09_08.py'
      - '.github/workflows/hardening-phase-a.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mizan-hardening-phase-a
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: جلب المصدر
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: إعداد Node
        uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - name: تثبيت الاعتمادات
        run: npm ci
      - name: تصحيح محرك الاستبدال في materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('APPLY_HARDENING_PHASE_A_2026_09_08.py')
          t=p.read_text(encoding='utf-8')
          old='out,n=re.subn(pattern,repl,text,count=count,flags=flags)'
          new='out,n=re.subn(pattern,lambda _m: repl,text,count=count,flags=flags)'
          if old not in t:
              raise SystemExit('materializer sub helper anchor missing')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: تطبيق إصلاحات الحفظ والصلاحيات والتجميد والتحقق
        run: python3 APPLY_HARDENING_PHASE_A_2026_09_08.py
      - name: تصحيح اسم أيقونة التجميد المتوافقة مع lucide
        run: sed -i 's/PauseCircle/CirclePause/g' src/components/admin/IdentityGovernance.tsx
      - name: فحص الأنواع
        run: npm run lint
      - name: الاختبارات
        run: npm test
      - name: تدقيق المصدر والأسرار
        run: npm run source-audit
      - name: تدقيق العربية
        run: npm run arabic-ui-audit
      - name: البناء
        run: npm run build
      - name: حفظ الملفات الفعلية في main
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          TARGETS=(
            shared/input-validation.ts
            src/lib/input-validation.ts
            src/main.tsx
            server/tenant-registry.ts
            server/tenant-store.ts
            src/lib/tenant.ts
            src/App.tsx
            server.ts
            server/identity-governance.ts
            src/components/auth/AuthPortal.tsx
            src/components/admin/IdentityGovernance.tsx
            src/components/admin/TenantConsole.tsx
            src/components/admin/RolePortals.tsx
            src/components/admin/TenantBrandStudio.tsx
            tests/product-hardening-phase-a.test.ts
          )
          git add -- "${TARGETS[@]}"
          git rm -f -- APPLY_HARDENING_PHASE_A_2026_09_08.py .github/workflows/hardening-phase-a.yml
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main changed while checks were running; refusing stale push.'
            exit 1
          fi
          git config user.name 'MIZAN CI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: harden tenant persistence access and scoped identity lifecycle'
          git push origin HEAD:main
          echo 'materialized=1' >> "$GITHUB_OUTPUT"
      - name: تشغيل الفحص النهائي
        if: steps.persist.outputs.materialized == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
