name: مستمع «يسمعك» على GPU — تشغيل يدوي

# زرُّ التجربة المدفوعة (docs/LISTENER-GPU.md): يُبنى مستمعُ GPU ويُنشر **خدمةً منفصلة**
# لا تمسّ الإنتاج، ثم — إن طُلب صراحةً — يُوجَّه ميزانُ إليها. الكلفةُ تجري فقط ما دام
# مثيلُها يعمل (نحو 1.05$/ساعة)، وتنام إلى الصفر بلا استخدام. والرجوعُ تشغيلةٌ بـroute=cpu.
#
# لا يعمل إلا يدويًّا (workflow_dispatch) ومن main — فلا كلفةَ تبدأ إلا بضغطة صاحب المشروع.

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'إقليمُ GPU (ليس me-central1 — لا GPU فيه)'
        required: true
        default: 'europe-west1'
      route:
        description: 'keep=انشر وتحقّق بلا تغيير (جرّب أولًا) · gpu=انشر ثم حوِّل ميزان إليه · cpu=أرجِع ميزان للقديم فورًا بلا بناء'
        required: true
        default: 'keep'
        type: choice
        options: [keep, gpu, cpu]
      min_instances:
        description: 'مثيلٌ دائم؟ 0=ينام إلى الصفر (الأرخص) · 1=جاهز دائمًا (~764$/شهر)'
        required: true
        default: '0'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mizan-listener-gpu
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: mizan-f2ce3
  GPU_SERVICE: mizan-quran-listener-gpu
  SOURCE_STAGING_BUCKET: gs://mizan-f2ce3-github-deploy-source/source
  GCP_BUILD_SERVICE_ACCOUNT: mizan-cloud-build@mizan-f2ce3.iam.gserviceaccount.com
  REGION: ${{ inputs.region }}
  ROUTE: ${{ inputs.route }}
  MIN_INSTANCES: ${{ inputs.min_instances }}

jobs:
  gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      # كما في نشر الإنتاج: main الموثوق وحده، لا مدخلاتُ ref.
      - name: جلب main الموثوق
        uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          fetch-depth: 1

      - name: فحص المدخلات
        run: |
          set -euo pipefail
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || { echo "::error::region غير صالح: $REGION"; exit 1; }
          [[ "$REGION" != me-central1 ]] || { echo "::error::me-central1 لا GPU فيه"; exit 1; }
          [[ "$MIN_INSTANCES" =~ ^[01]$ ]] || { echo "::error::min_instances إمّا 0 أو 1 (السقف مثيلٌ واحد): $MIN_INSTANCES"; exit 1; }

      - name: مصادقة Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: تجهيز gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 500.0.0'

      # كلُّ ما يمسّ Cloud Run يجري داخل Cloud Build بحساب البناء — كما ينشر الإنتاج — لأن حسابَ
      # هذا العدّاء لا يملك من Cloud Run إلا القراءة. route=cpu رجوعٌ وحده بلا بناء
      # (cloudbuild.gpu-route.yaml)، فيعمل ولو كانت خدمةُ GPU معطوبة.
      #
      # سجلُّ البناء في Cloud Logging لا في التشغيلة (CLOUD_LOGGING_ONLY): يُسحب ذيلُه هنا نجحَ أو
      # فشل — الأخيرُ لا الأوّل، فسطرُ الخطأ في النهاية. وعند الفشل يُسحب معه سجلُّ خدمة GPU نفسِها:
      # عطبُ CUDA يقع عند الإقلاع هناك، لا في البناء.
      - name: البناء والنشر والصحّة — داخل Cloud Build
        run: |
          set -euo pipefail
          SRC=services/quran-practice-listener
          ARGS=(--service-account="projects/$GCP_PROJECT_ID/serviceAccounts/$GCP_BUILD_SERVICE_ACCOUNT"
                --gcs-source-staging-dir="$SOURCE_STAGING_BUCKET")
          if [ "$ROUTE" = cpu ]; then
            ARGS+=(--config "$SRC/cloudbuild.gpu-route.yaml")
          else
            TAG="me-central1-docker.pkg.dev/$GCP_PROJECT_ID/cloud-run-source-deploy/$GPU_SERVICE:$GITHUB_SHA"
            ARGS+=(--config "$SRC/cloudbuild.gpu.yaml"
                   --substitutions "_TAG=$TAG,_REGION=$REGION,_MIN_INSTANCES=$MIN_INSTANCES,_ROUTE=$ROUTE,COMMIT_SHA=$GITHUB_SHA")
          fi
          OUT="$(mktemp)"
          ok=0
          gcloud builds submit "$SRC" "${ARGS[@]}" 2>&1 | tee "$OUT" || ok=$?
          BID="$(grep -oE 'builds/[0-9a-f-]{36}' "$OUT" | head -1 | cut -d/ -f2 || true)"
          touch "$RUNNER_TEMP/build.log"
          if [ -n "$BID" ]; then
            gcloud logging read "resource.type=\"build\" AND resource.labels.build_id=\"$BID\"" \
              --project "$GCP_PROJECT_ID" --order=desc --limit=400 --format='value(textPayload)' \
              | tac > "$RUNNER_TEMP/build.log" || true
          fi
          echo "::group::Cloud Build log ${BID} (آخر 400 سطر)"
          cat "$RUNNER_TEMP/build.log"
          echo "::endgroup::"
          if [ "$ok" != "0" ] && [ "$ROUTE" != cpu ]; then
            echo "::group::GPU service log (آخر 80 سطر)"
            gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$GPU_SERVICE\"" \
              --project "$GCP_PROJECT_ID" --freshness=2h --order=desc --limit=80 --format='value(textPayload)' \
              | tac || true
            echo "::endgroup::"
          fi
          exit "$ok"

      - name: الملخّص
        if: always()
        run: |
          {
            echo "## مستمع GPU"
            echo "- الخدمة: \`$GPU_SERVICE\` في \`$REGION\` — min-instances=$MIN_INSTANCES"
            echo "- المطلوب: \`$ROUTE\`"
            echo "- الصحّة والتوجيه (من سجل البناء):"
            echo '```'
            grep -h 'MIZAN_GPU_' "$RUNNER_TEMP/build.log" 2>/dev/null || echo '(لا شيء — انظر سجلّ الخطوة السابقة)'
            echo '```'
            echo "- الكلفة تجري ما دام مثيلٌ يعمل (~1.05\$/ساعة). للإيقاف: شغِّل بـroute=cpu ثم احذف الخدمة إن شئت."
          } >> "$GITHUB_STEP_SUMMARY"
