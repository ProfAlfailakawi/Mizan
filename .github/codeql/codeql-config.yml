# إعداد CodeQL لميزان.
#
# لماذا هذا الملف موجود:
#
# قاعدة «تخزين بيانات حساسة بنص واضح» تعتبر كل معرّف يطابق cert* بيانات اعتماد أمنية.
# وفي ميزان، «الشهادة» شهادة تقدير لمتسابق، و«المعتمد» رواية معتمدة لمحكّم:
# certificates · certNumber · certificateId · certifiedRiwayat · certifiedVenueSeals …
#
# فكانت القاعدة تُبلّغ عن كتابة النسخة المحلية في كل طلب يمسّ src/lib/store.ts، بلا استثناء،
# وسببها اسمٌ في الكود لا سلوكٌ فيه. ورفض التنبيه يدويًا في كل مرة يُعوّد المراجعين على تجاهل
# تنبيهات الأمن — وهو أسوأ من التنبيه نفسه.
#
# ولم نغيّر أسماء حقول المجال لإسكات المحلّل: الأسماء صحيحة، والتأويل هو الخطأ.
#
# ما لم يُستثنَ: بقية قواعد الأمن كلها تعمل كما هي، ومنها قواعد الحقن وتزوير الطلبات
# والمسارات ونقص الحدّ المعدّل — وقد كشفت عيوبًا حقيقية في هذا المستودع وأُصلحت.
#
# ملاحظة تشغيلية: يسري هذا الملف على «الإعداد المتقدّم» لفحص الشيفرة. إن كان المستودع على
# «الإعداد الافتراضي»، يلزم تحويله إلى المتقدّم من إعدادات الأمن ليُقرأ هذا الملف.

name: "Mizan CodeQL"

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: js/clear-text-storage-of-sensitive-information
