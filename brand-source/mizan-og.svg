<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient: Deep Sacred Emerald -->
    <radialGradient id="emeraldCanvas" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14463a"/>
      <stop offset="35%" stop-color="#0e362c"/>
      <stop offset="70%" stop-color="#09251e"/>
      <stop offset="100%" stop-color="#041410"/>
    </radialGradient>

    <!-- Golden Divine Center Glow -->
    <radialGradient id="centerAura" cx="50%" cy="36%" r="42%">
      <stop offset="0%" stop-color="#f5dfa6" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#c5a059" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 24K Gold Metallic Linear Gradient -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ea"/>
      <stop offset="22%" stop-color="#e8cb93"/>
      <stop offset="50%" stop-color="#b98b4e"/>
      <stop offset="78%" stop-color="#eed59f"/>
      <stop offset="100%" stop-color="#c59f5b"/>
    </linearGradient>

    <!-- Horizontal Gold Fading Line -->
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b98b4e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e8cb93" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fff9ea" stop-opacity="1"/>
      <stop offset="75%" stop-color="#e8cb93" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b98b4e" stop-opacity="0"/>
    </linearGradient>

    <!-- Badge Surface Gradient -->
    <linearGradient id="badgeSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15493d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a2922" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Islamic Geometric Girih Tessellation Pattern -->
    <pattern id="girihPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <g stroke="#e2c88f" stroke-width="0.85" stroke-opacity="0.12" fill="none">
        <!-- 8-Pointed Star Centerpiece -->
        <polygon points="60,20 69,42 91,33 82,55 104,60 82,65 91,87 69,78 60,100 51,78 29,87 38,65 16,60 38,55 29,33 51,42"/>
        <!-- Surrounding diamond tessellations -->
        <rect x="35" y="35" width="50" height="50" transform="rotate(45 60 60)"/>
        <line x1="0" y1="0" x2="120" y2="120"/>
        <line x1="120" y1="0" x2="0" y2="120"/>
        <circle cx="60" cy="60" r="18" stroke-dasharray="2,3"/>
        <circle cx="0" cy="0" r="14"/>
        <circle cx="120" cy="0" r="14"/>
        <circle cx="0" cy="120" r="14"/>
        <circle cx="120" cy="120" r="14"/>
      </g>
    </pattern>

    <!-- Rich Drop Shadow -->
    <filter id="markShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#e8cb93" flood-opacity="0.3"/>
    </filter>

    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. Background Foundation -->
  <rect width="1200" height="630" fill="url(#emeraldCanvas)"/>
  <rect width="1200" height="630" fill="url(#girihPattern)"/>
  <rect width="1200" height="630" fill="url(#centerAura)"/>

  <!-- 2. Dual Luxury Architectural Frame with Corner Medallions -->
  <g>
    <!-- Outer Frame -->
    <rect x="22" y="22" width="1156" height="586" rx="14" fill="none" stroke="url(#gold24k)" stroke-width="1.8" stroke-opacity="0.5"/>
    <!-- Inner Inset Frame -->
    <rect x="30" y="30" width="1140" height="570" rx="10" fill="none" stroke="url(#gold24k)" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- 4 Elaborate Corner Arabesque Motifs -->
    <!-- Top-Left Corner -->
    <g transform="translate(30 30)">
      <path d="M0,32 L0,0 L32,0" fill="none" stroke="url(#gold24k)" stroke-width="2.5"/>
      <polygon points="14,14 20,4 28,14 20,24" fill="url(#gold24k)"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff"/>
    </g>
    <!-- Top-Right Corner -->
    <g transform="translate(1170 30)">
      <path d="M0,32 L0,0 L-32,0" fill="none" stroke="url(#gold24k)" stroke-width="2.5"/>
      <polygon points="-14,14 -20,4 -28,14 -20,24" fill="url(#gold24k)"/>
      <circle cx="-14" cy="14" r="2.5" fill="#ffffff"/>
    </g>
    <!-- Bottom-Left Corner -->
    <g transform="translate(30 600)">
      <path d="M0,-32 L0,0 L32,0" fill="none" stroke="url(#gold24k)" stroke-width="2.5"/>
      <polygon points="14,-14 20,-4 28,-14 20,-24" fill="url(#gold24k)"/>
      <circle cx="14" cy="-14" r="2.5" fill="#ffffff"/>
    </g>
    <!-- Bottom-Right Corner -->
    <g transform="translate(1170 600)">
      <path d="M0,-32 L0,0 L-32,0" fill="none" stroke="url(#gold24k)" stroke-width="2.5"/>
      <polygon points="-14,-14 -20,-4 -28,-14 -20,-24" fill="url(#gold24k)"/>
      <circle cx="-14" cy="-14" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- 3. Top Institutional Header Pill -->
  <g transform="translate(600 74)" text-anchor="middle">
    <rect x="-195" y="-18" width="390" height="36" rx="18" fill="url(#badgeSurface)" stroke="url(#gold24k)" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Gold Accents Left & Right -->
    <circle cx="-165" cy="0" r="3.5" fill="url(#gold24k)"/>
    <text x="0" y="5.5" font-family="'Cairo', 'Alexandria', sans-serif" font-weight="700" font-size="13" fill="#ecd39e" letter-spacing="0.8">
      المنظومة العالمية المعتمدة للمسابقات القرآنية
    </text>
    <circle cx="165" cy="0" r="3.5" fill="url(#gold24k)"/>
  </g>

  <!-- 4. Central Sacred Emblem: MIZAN Mihrab & Open Mushaf (1.9x Scale) -->
  <g transform="translate(600 196)" filter="url(#markShadow)">
    <g transform="scale(1.9) translate(-60 -50)">
      <!-- Golden Apex Diamond -->
      <path d="M60 2.5 64.6 8.6 60 14.7 55.4 8.6Z" fill="url(#gold24k)"/>
      <!-- Mihrab Ogee Arch with Precise Mitre -->
      <path d="M39.5 90C34.5 81.5 30.8 70.5 32.2 54 34 35 56.4 28 60 20c3.6 8 26 15 27.8 34 1.4 16.5-2.3 27.5-7.3 36"
            fill="none" stroke="url(#gold24k)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="7"/>
      <!-- Quran Binding / Outer Covers -->
      <path d="M60 96c-12-8.5-26.5-11-40-9-.5 6 4 11.5 11.5 13.5 13.5 0 22.5 2 28.5 5.5Z" fill="#184b3e" stroke="#d8b172" stroke-width="1"/>
      <path d="M60 96c12-8.5 26.5-11 40-9 .5 6-4 11.5-11.5 13.5-13.5 0-22.5 2-28.5 5.5Z" fill="#184b3e" stroke="#d8b172" stroke-width="1"/>
      <!-- Illuminated Parchment Pages -->
      <path d="M60 71c-13.5-9.5-27-13.5-40-11.5 2 8.5 2 19 0 27.5 13.5-2 28 .5 40 9Z" fill="#fffef8" stroke="#d8b172" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M60 71c13.5-9.5 27-13.5 40-11.5-2 8.5-2 19 0 27.5-13.5-2-28 .5-40 9Z" fill="#fffef8" stroke="#d8b172" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Leaf Creases -->
      <path d="M60 80c-11-7.6-22.6-10.6-33.6-9.6" fill="none" stroke="#d8b172" stroke-width="1.1" opacity="0.65"/>
      <path d="M60 80c11-7.6 22.6-10.6 33.6-9.6" fill="none" stroke="#d8b172" stroke-width="1.1" opacity="0.65"/>
      <!-- Central Qalam Shaft (Balance Beam) & Golden Orb -->
      <path d="M60 43c.85 0 1.35 2.2 1.5 9.4l.55 33.6c.08 6.2-.7 11.4-2.05 15.5-1.35-4.1-2.13-9.3-2.05-15.5l.55-33.6c.15-7.2.65-9.4 1.5-9.4Z" fill="url(#gold24k)"/>
      <circle cx="60" cy="39" r="5.6" fill="url(#gold24k)"/>
      <circle cx="58.2" cy="37.2" r="1.8" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- 5. Regal Typography Suite -->
  <g text-anchor="middle">
    <!-- Arabic Primary Title "مِيـزَان" -->
    <text x="600" y="358" font-family="'Amiri', 'Cairo', serif" font-weight="700" font-size="70" fill="#ffffff" filter="url(#glowText)" letter-spacing="2">
      مِيـــزَان
    </text>

    <!-- Sub-heading Latin "MIZAN" flanked by Gold Rules -->
    <g transform="translate(600 398)">
      <line x1="-240" y1="-5" x2="-75" y2="-5" stroke="url(#goldRule)" stroke-width="1.6"/>
      <line x1="75" y1="-5" x2="240" y2="-5" stroke="url(#goldRule)" stroke-width="1.6"/>
      <polygon points="-75,-5 -71,-9 -67,-5 -71,-1" fill="url(#gold24k)"/>
      <polygon points="75,-5 71,-9 67,-5 71,-1" fill="url(#gold24k)"/>
      <text x="0" y="0" font-family="'Cairo', sans-serif" font-weight="700" font-size="19" fill="url(#gold24k)" letter-spacing="9">
        MIZAN
      </text>
    </g>

    <!-- Core Value Statement in Arabic -->
    <text x="600" y="446" font-family="'Alexandria', 'Cairo', sans-serif" font-weight="600" font-size="23" fill="#fcf6e8" letter-spacing="0.3">
      نظام تشغيل وتحكيم المسابقات القرآنية بنزاهةٍ رقمية وهدوء
    </text>

    <!-- English Secondary Subtitle -->
    <text x="600" y="478" font-family="'Cairo', sans-serif" font-weight="400" font-size="14" fill="#a4c2b7" letter-spacing="0.6">
      Autonomous Digital Infrastructure for National &amp; International Quran Competitions
    </text>
  </g>

  <!-- 6. Bottom Authority Pillars / Verification Badges -->
  <g transform="translate(600 542)">
    <!-- Badge 1: KFGQPC Mushaf Certified -->
    <g transform="translate(290 0)">
      <rect x="-125" y="-21" width="250" height="42" rx="12" fill="url(#badgeSurface)" stroke="url(#gold24k)" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="102" cy="0" r="4.5" fill="#48d597"/>
      <text x="0" y="5.5" font-family="'Cairo', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
        نص مجمع الملك فهد المعتمد
      </text>
    </g>

    <!-- Badge 2: Cryptographic Proof & Ledger -->
    <g transform="translate(0 0)">
      <rect x="-140" y="-21" width="280" height="42" rx="12" fill="url(#badgeSurface)" stroke="url(#gold24k)" stroke-width="1.3" stroke-opacity="0.65"/>
      <circle cx="116" cy="0" r="4.5" fill="#f0d592"/>
      <text x="0" y="5.5" font-family="'Cairo', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
        أختام مشفرة وسجل نزاهة متسلسل
      </text>
    </g>

    <!-- Badge 3: Governed AI & Offline-First Live Audio -->
    <g transform="translate(-290 0)">
      <rect x="-125" y="-21" width="250" height="42" rx="12" fill="url(#badgeSurface)" stroke="url(#gold24k)" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="102" cy="0" r="4.5" fill="#48d597"/>
      <text x="0" y="5.5" font-family="'Cairo', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">
        تحكيم صوتي متزامن وبلا إنترنت
      </text>
    </g>
  </g>
</svg>
