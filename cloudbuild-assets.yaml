steps:
  - name: 'node:22-slim'
    id: 'official-source-audit'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        apt-get update -qq
        apt-get install -y --no-install-recommends unzip ca-certificates curl >/dev/null
        npm install --ignore-scripts --no-audit --no-fund
        npm test
        export NODE_OPTIONS="--dns-result-order=ipv4first --require=$$PWD/scripts/kfgqpc-fetch-fallback.cjs"
        npx tsx scripts/kfgqpc-init-stage.ts .mizan-ingest
        npx tsx scripts/kfgqpc-acquire.ts --root .mizan-ingest
        npx tsx scripts/kfgqpc-science-intake.ts --root .mizan-ingest
        npx tsx scripts/kfgqpc-audio-discovery.ts --root .mizan-ingest
        npx tsx scripts/kfgqpc-heavy-acquire.ts --root .mizan-ingest
        npx tsx scripts/kfgqpc-ingest.ts --dry-run --root .mizan-ingest
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1800s'
