steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'
      # Vite inlines VITE_* at build time, so the Firebase web config must be supplied here.
      # These are public client identifiers; server secrets stay in Secret Manager (below).
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'VITE_REQUIRE_AUTH=${_VITE_REQUIRE_AUTH}'
      # Tenant staff MFA stays opt-in. The platform owner has a dedicated production guard.
      - '--build-arg'
      - 'VITE_REQUIRE_MFA_FOR_SENSITIVE=${_VITE_REQUIRE_MFA_FOR_SENSITIVE}'
      - '--build-arg'
      - 'VITE_REQUIRE_MFA_FOR_SUPER_ADMIN=${_VITE_REQUIRE_MFA_FOR_SUPER_ADMIN}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'


  # «يسمعك» الحقيقي: نموذج قرآني مستقل للتدريب، لا محرّك ظلّ غير منشور.
  # allowFailure: المستمعُ خدمةٌ مساعدة. تعثُّرُه لا يجوز أن يُسقط نشرَ ميزان كلّه — وقد
  # أسقطه فعلًا في كل دفعةٍ منذ أُضيف، فلم يصل الإنتاجَ لا هو ولا شيءٌ بعده.
  - name: 'gcr.io/cloud-builders/docker'
    allowFailure: true
    args:
      - 'build'
      - '-t'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan-quran-listener:$COMMIT_SHA'
      - 'services/quran-practice-listener'

  - name: 'gcr.io/cloud-builders/docker'
    allowFailure: true
    args:
      - 'push'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan-quran-listener:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    allowFailure: true
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        # مجسُّ الإقلاع على `/ready`: النسخةُ لا تُعدّ مُقلعةً حتى يُحمَّل نموذجُها (حتى عشر دقائق،
        # بالمعالج كاملًا)، فلا تُرسل إليها حركةٌ قبله ولا يُخنق تحميلُه. وكان مجسُّ TCP الافتراضيّ
        # يُسقط كلَّ نسخةٍ جديدة، فبقيت الحركةُ على نسخةٍ قديمةٍ لا يكتمل تحميلُها أبدًا.
        gcloud run deploy mizan-quran-listener \
          --image "me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan-quran-listener:$COMMIT_SHA" \
          --region me-central1 --platform managed --no-allow-unauthenticated \
          --cpu 2 --memory 2Gi --min-instances 0 --max-instances 3 --concurrency 4 \
          --timeout 60 --cpu-boost --update-env-vars "MIZAN_BUILD_SHA=$COMMIT_SHA" \
          --startup-probe=httpGet.path=/ready,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=10,timeoutSeconds=5,failureThreshold=60 \
          --quiet
        listener_url="$(gcloud run services describe mizan-quran-listener --region me-central1 --format='value(status.url)')"
        test -n "$listener_url"
        runtime_sa="$(gcloud run services describe mizan --region me-central1 --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)"
        if [ -z "$runtime_sa" ]; then
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
        fi
        gcloud run services add-iam-policy-binding mizan-quran-listener --region me-central1 \
          --member "serviceAccount:${runtime_sa}" --role roles/run.invoker --quiet >/dev/null
        printf '%s' "$listener_url/listen" > /workspace/mizan-quran-listener-url

  # قواعد Firestore تُنشر مع كل دفعة، لا بيدٍ حين يتذكّر أحد.
  #
  # القواعد هي الحماية الحقيقية للبيانات — لا إخفاء المفاتيح — وكانت تُنشر يدويًا من جهاز
  # المالك بأمر يُكتب من الذاكرة. وذلك يعني أن الشيفرة قد تُنشر وقواعدها لم تُنشر، فتعمل
  # المنصّة على قواعد قديمة لا يعلم أحد أنها قديمة. الآن يمشيان معًا أو لا يمشي أيّهما.
  #
  # وترتيبها قبل نشر الخدمة مقصود: البناء إن فشل لم تُمسّ القواعد، والقواعد إن فشلت لم
  # تُنشر شيفرة تعتمد عليها.
  #
  # وما يبقى بعد ذلك: إن نُشرت القواعد ثم فشل نشر الخدمة، بقيت النسخة القديمة تعمل تحت
  # القواعد الجديدة. فالشرط على كل تغيير قواعد أن يكون **متوافقًا مع النسخة العاملة**،
  # كأي تغيير مخطط بيانات. والترتيب المعكوس أسوأ: شيفرة جديدة تعمل تحت قواعد قديمة تعني
  # صلاحيةً لم تُضبط بعد.
  #
  # ولا يُتراجَع عن القواعد تلقائيًا عند فشل الخدمة: التراجع يُعيد قواعد أوسع، وقد يكون
  # التغيير سدّ ثغرة. فيُترك القرار لمن يعرف ماذا غيّر، ويبقى الفشل مرئيًا في سجل البناء.
  #
  # والاعتماد من حساب خدمة Cloud Build نفسه عبر بيانات الاعتماد الافتراضية: لا رمز مخزَّن،
  # ولا تسجيل دخول، ولا سرّ يُضاف. ويلزم منح ذلك الحساب دور firebaserules.admin مرة واحدة.
  # scripts/setup-github-cloudrun-wif.sh يضبط ذلك على حساب Cloud Build الفعلي بدل افتراض اسمه.
  #
  # ملاحظة على الصياغة: Cloud Build يستبدل كل `$` قبل أن تصل إلى الصدفة، فلا تُستعمل هنا
  # متغيّرات صدفة ولا `$(...)` — وحده `$PROJECT_ID` مقصودٌ استبداله.
  - name: 'node:22-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        if ! npx --yes firebase-tools@15.30.0 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive; then
          echo ''
          echo 'تعذّر نشر قواعد Firestore.'
          echo 'شغّل مرة واحدة من Cloud Shell:'
          echo '  bash scripts/setup-github-cloudrun-wif.sh'
          echo 'فالسكريبت يكتشف حساب Cloud Build الفعلي ويمنحه صلاحية القواعد المطلوبة.'
          exit 1
        fi

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: mizan-deploy
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mizan'
      - '--image'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'
      - '--region'
      - 'me-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # مخازن الختم والنشر الحالية ملفية على وحدة Cloud Storage المشتركة. لذلك يبقى
      # الكاتب واحدًا إلى أن يُنقل السجلان إلى معاملة Firestore مشتركة. رفع هذا الرقم قبل
      # ذلك يعيد سباق ختم/نشر لا يمكن منعه بقفل ملف محلي.
      - '--max-instances'
      - '1'
      # اربط كل revision بالـcommit الذي أنشأه. GitHub يتحقق من هذه البصمة بعد النشر.
      - '--update-labels'
      - 'mizan-git-sha=$COMMIT_SHA'
      # سجلُّ الشهادات، سجلُّ أختام النتائج، وحالةُ النشر على الوحدة الدائمة نفسها.
      #
      # `MIZAN_CERTIFICATE_REGISTRY_DIR` لم يكن مضبوطًا في أيّ نشرة، فكان
      # `certificateRegistryFromEnv()` يعود بـ`null` ويردّ نشرُ الشهادة وإبطالُها
      # `CERTIFICATE_REGISTRY_NOT_CONFIGURED`. وسجلا الختم والنشر كانا كذلك غير مهيَّأين
      # لأنهما لا يملكان مسارًا مستقلًا ولا يرثان شيئًا إن كان سجل التدقيق على Firestore.
      # المسارات ليست أسرارًا، وتبقى آمنة مع قيد الكاتب الواحد أعلاه والوحدة الدائمة.
      #
      # سرّا التوقيع (`MIZAN_PASS_SIGNING_SECRET` و`MIZAN_CERT_SIGNING_SECRET`) موجودان
      # في Secret Manager، وحساب تشغيل Cloud Run مخوّل بقراءتهما. إبقاؤهما في
      # `--update-secrets` يضمن ألّا يسقط الربط بصمت في أيّ revision لاحق.
      # راجع docs/SIGNING-SECRETS.md.
      # Preserve the private R2 contract on every deployment without exposing secret values to Cloud Build.
      # سلطة النزاهة تُهيَّأ مرة بـcloudbuild-integrity.yaml؛ وهذه الأسطر تُبقيها قائمة بعد كل
      # نشر. `--update-*` لا يمسّ ما لا يُذكر، فوحدة التخزين المركّبة والمفتاح يبقيان.
      # النطاقُ `mizan.dr-alfailakawi.com` **أفاد به المالك في 20 سبتمبر 2026** بأنه
      # العنوانُ الذي يفتح به ميزان. وكان مشتقًّا قبل ذلك من `firebase.json`
      # (`mizan-f2ce3.web.app`)، وهو اشتقاقٌ كان قد يكون خاطئًا: لا شيءَ في هذا
      # المستودع ينشر Firebase Hosting — ينشر قواعدَ Firestore وحدها — فلم يكن
      # لأحدٍ أن يجزم أن ذلك النطاق يُحوِّل إلى الخدمة.
      #
      # والوثيقتان تُخدَمان من ميزان نفسِه على `/legal/terms` و`/legal/privacy`
      # (انظر `server/legal-publication.ts`)، فالمساران يعملان سواءٌ وصل النطاقُ
      # عبر Hosting أو عبر ربطِ نطاقٍ بـCloud Run. والنسخةُ والتاريخُ منقولان من رأس
      # الملفّين لا مكتوبان من ذاكرة.
      #
      # **وإن غُيِّر النطاقُ يومًا فهذان الموضعان وحدهما.** ولا يُصدَّق أيُّ عنوانٍ هنا
      # بلا قياس: خطوةُ `verify:legal-publication` في مسار النشر تجلب العنوانين فعلًا
      # وتقارن ما يردّانه بما ضُبط، فتحمرّ النشرةُ إن كان النطاقُ باليًا أو خاطئًا —
      # ولا يُسجَّل قبولُ متسابقٍ على عنوانٍ لا يفتح دون أن يعلم أحد.
      - '--update-env-vars'
      - 'FIREBASE_PROJECT_ID=mizan-f2ce3,R2_ENDPOINT=https://c5d74db879abf3d428e4abdd485d338a.r2.cloudflarestorage.com,R2_BUCKET=mizan-quran-assets,MIZAN_SAAS_DATA_DIR=/mnt/authority/saas,MIZAN_INTEGRITY_AUTHORITY_DIR=/mnt/authority,MIZAN_INTEGRITY_AUTHORITY_DURABLE=true,MIZAN_CONTROL_TOWER_DIR=/mnt/authority/control-tower,MIZAN_OPS_TELEMETRY_DIR=/mnt/authority/control-tower/telemetry,MIZAN_CERTIFICATE_REGISTRY_DIR=/mnt/authority/certificates,MIZAN_SEAL_REGISTRY_DIR=/mnt/authority/result-seals,MIZAN_PUBLICATION_STORE_DIR=/mnt/authority/result-publications,MIZAN_REQUIRE_MFA_FOR_SUPER_ADMIN=true,MIZAN_LEGAL_ENTITY_NAME=شركة سكاي جيت للإستشارات التربوية,MIZAN_LEGAL_TERMS_URL=https://mizan.dr-alfailakawi.com/legal/terms,MIZAN_LEGAL_TERMS_VERSION=1.0,MIZAN_LEGAL_TERMS_EFFECTIVE=2026-09-20,MIZAN_LEGAL_PRIVACY_URL=https://mizan.dr-alfailakawi.com/legal/privacy,MIZAN_LEGAL_PRIVACY_VERSION=1.0,MIZAN_LEGAL_PRIVACY_EFFECTIVE=2026-09-20'
      - '--update-secrets'
      - 'R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,MIZAN_PASS_SIGNING_SECRET=MIZAN_PASS_SIGNING_SECRET:latest,MIZAN_CERT_SIGNING_SECRET=MIZAN_CERT_SIGNING_SECRET:latest'
      - '--quiet'

  # ── «المعلّم القرآني»: كشفُ التشكيل والتجويد (services/quran-muaalem) ─────────
  #
  # يُبنى بالتوازي مع ميزان (waitFor: '-') فلا يطيل النشر، ولا يُعاد بناؤه إلا إذا تغيّر
  # مصدرُه: الوسمُ بصمةُ ملفّات الخدمة، فإن وُجدت الصورةُ بوسمها في السجلّ أُعيد استعمالها.
  # وكلُّ خطواته allowFailure: خدمةٌ مساعدة لا تُسقط ميزان. والصورةُ تجري اختباراتها (٢٤)
  # داخلها قبل أن تُنزّل النموذج، فصورةٌ لا تجتازها لا تُبنى.
  - name: 'gcr.io/cloud-builders/docker'
    id: muaalem-image
    waitFor: ['-']
    allowFailure: true
    timeout: '1800s'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        src_hash="$(find services/quran-muaalem -type f ! -path '*/__pycache__/*' | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-16)"
        image="me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan-quran-muaalem:src-${src_hash}"
        if docker manifest inspect "$image" >/dev/null 2>&1; then
          echo "muaalem image unchanged; reusing $image"
        else
          docker build -t "$image" services/quran-muaalem
          docker push "$image"
        fi
        printf '%s' "$image" > /workspace/mizan-quran-muaalem-image

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: muaalem-deploy
    waitFor: ['muaalem-image']
    allowFailure: true
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        if [ ! -s /workspace/mizan-quran-muaalem-image ]; then echo 'muaalem image not built; keeping previous deployment'; exit 0; fi
        image="$(cat /workspace/mizan-quran-muaalem-image)"
        current="$(gcloud run services describe mizan-quran-muaalem --region me-central1 --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)"
        if [ "$current" != "$image" ]; then
          # ٤ معالجات و8Gi: النموذجُ نحو ٦٦٠ مليون معامل بدقّة float32. طلبٌ واحدٌ في المرّة
          # (concurrency 1)، ولا نسخةَ دائمة (min 0): لا كلفةَ إلا حين يُطلب التحليل.
          gcloud run deploy mizan-quran-muaalem --image "$image" \
            --region me-central1 --platform managed --no-allow-unauthenticated \
            --cpu 4 --memory 8Gi --min-instances 0 --max-instances 2 --concurrency 1 \
            --timeout 300 --cpu-boost --quiet
        else
          echo "muaalem already serving $image"
        fi
        url="$(gcloud run services describe mizan-quran-muaalem --region me-central1 --format='value(status.url)')"
        test -n "$url"
        runtime_sa="$(gcloud run services describe mizan --region me-central1 --format='value(spec.template.spec.serviceAccountName)' 2>/dev/null || true)"
        if [ -z "$runtime_sa" ]; then
          project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
        fi
        gcloud run services add-iam-policy-binding mizan-quran-muaalem --region me-central1 \
          --member "serviceAccount:${runtime_sa}" --role roles/run.invoker --quiet >/dev/null
        printf '%s' "$url" > /workspace/mizan-quran-muaalem-url

  # اربط النسخة المنشورة بالمستمع الخاص بعد معرفة عنوان Cloud Run الفعلي.
  # update-env-vars يحافظ على بقية إعدادات الخدمة ولا ينشئ سرًّا في المستودع.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: bind-engines
    waitFor: ['mizan-deploy', 'muaalem-deploy']
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        # ما لم يُنشر في هذه الدفعة يبقى ربطُه السابق كما هو، ولا يسقط النشر.
        vars=''
        if [ -s /workspace/mizan-quran-listener-url ]; then vars="MIZAN_QURAN_PRACTICE_LISTENER_URL=$(cat /workspace/mizan-quran-listener-url)"; fi
        if [ -s /workspace/mizan-quran-muaalem-url ]; then vars="${vars:+$vars,}MIZAN_QURAN_MUAALEM_URL=$(cat /workspace/mizan-quran-muaalem-url)"; fi
        if [ -z "$vars" ]; then echo 'no engine deployed in this build; keeping previous bindings'; exit 0; fi
        gcloud run services update mizan --region me-central1 --update-env-vars "$vars" --quiet

  # تنظيفُ الصور القديمة: كلُّ نشرٍ يرفع صورةً كاملةً لميزان وللمستمع (وللمعلّم حين يتغيّر)،
  # ولم يكن ما يحذف القديم — فيكبر التخزينُ مع كل دفعةٍ ولا ينقص (٠٫١٠$ لكل غيغابايت شهريًّا).
  # فيُبقى أحدثُ عشر نسخٍ لكلّ خدمة (يُرجع إلى أيٍّ منها: المراجعةُ تحتاج صورتَها)، ويُحذف ما
  # جاوز ثلاثين يومًا، وما بلا وسمٍ بعد يوم. والقاعدةُ تُكتب في المستودع نفسه فتعمل بين الدفعات،
  # وتُعاد كتابتُها كلَّ دفعةٍ فلا تنحرف. وتعثُّرُها (صلاحيةٌ ناقصة) لا يُسقط النشر، ويُقال سببُه.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: image-cleanup
    waitFor: ['-']
    allowFailure: true
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        cat > /workspace/image-cleanup-policy.json <<'JSON'
        [
          {"name": "keep-latest-10", "action": {"type": "Keep"}, "mostRecentVersions": {"keepCount": 10}},
          {"name": "delete-untagged-after-1d", "action": {"type": "Delete"}, "condition": {"tagState": "untagged", "olderThan": "1d"}},
          {"name": "delete-after-30d", "action": {"type": "Delete"}, "condition": {"tagState": "any", "olderThan": "30d"}}
        ]
        JSON
        if ! gcloud artifacts repositories set-cleanup-policies cloud-run-source-deploy \
            --project "$PROJECT_ID" --location me-central1 \
            --policy /workspace/image-cleanup-policy.json --no-dry-run --quiet; then
          echo 'image cleanup policy not applied — the build service account needs roles/artifactregistry.repoAdmin on cloud-run-source-deploy'
          exit 1
        fi
        gcloud artifacts repositories describe cloud-run-source-deploy --project "$PROJECT_ID" --location me-central1 \
          --format='value(sizeBytes)' | awk '{printf "cloud-run-source-deploy size now: %.2f GiB\n", $1/1073741824}'

substitutions:
  # إعدادات Firebase العلنية. النشر الحي يتطلب المصادقة.
  # مفتاح ويب Firebase معرّف علني كبقية معرّفات Firebase أعلاه (تحميه قيود النطاق لا الإخفاء).
  _VITE_FIREBASE_API_KEY: 'AIzaSyAU13efq58hCJirGDyu9dZf8lzRatbhwcY'
  _VITE_FIREBASE_AUTH_DOMAIN: 'mizan-f2ce3.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'mizan-f2ce3'
  _VITE_FIREBASE_STORAGE_BUCKET: 'mizan-f2ce3.firebasestorage.app'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: '993698501419'
  _VITE_FIREBASE_APP_ID: '1:993698501419:web:47a25e46ccbacccb17ab6e'
  _VITE_REQUIRE_AUTH: 'true'
  # موظفو الجهة: MFA اختياري وفق سياسة الجهة الحالية.
  _VITE_REQUIRE_MFA_FOR_SENSITIVE: 'false'
  # مالك المنصة: MFA إلزامي في الإنتاج بشكل مستقل عن سياسة موظفي الجهة.
  _VITE_REQUIRE_MFA_FOR_SUPER_ADMIN: 'true'

images:
  - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'
  # صورةُ المستمع لا تُدرج هنا: `images` يُلزم بوجود كل صورةٍ مذكورة، فتعثّرُ بنائها
  # كان سيُسقط النشرَ كلّه من جديد. تُدفع في خطوتها الخاصة (allowFailure) وحدها.

# ٤٠ دقيقة: بناءُ المعلّم (torch ونموذجُه) يجري بالتوازي، ولا يُعاد إلا إذا تغيّر مصدرُه.
# ومسارُ النشر في GitHub ينتظر ٤٥ دقيقة، فيبقى هذا دونه.
timeout: '2400s'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
