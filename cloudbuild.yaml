steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'
      # Vite inlines VITE_* at build time, so the Firebase web config must be supplied here.
      # These are public client identifiers; server secrets stay in Secret Manager (below).
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'VITE_REQUIRE_AUTH=${_VITE_REQUIRE_AUTH}'
      # Tenant staff MFA stays opt-in. The platform owner has a dedicated production guard.
      - '--build-arg'
      - 'VITE_REQUIRE_MFA_FOR_SENSITIVE=${_VITE_REQUIRE_MFA_FOR_SENSITIVE}'
      - '--build-arg'
      - 'VITE_REQUIRE_MFA_FOR_SUPER_ADMIN=${_VITE_REQUIRE_MFA_FOR_SUPER_ADMIN}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'

  # قواعد Firestore تُنشر مع كل دفعة، لا بيدٍ حين يتذكّر أحد.
  #
  # القواعد هي الحماية الحقيقية للبيانات — لا إخفاء المفاتيح — وكانت تُنشر يدويًا من جهاز
  # المالك بأمر يُكتب من الذاكرة. وذلك يعني أن الشيفرة قد تُنشر وقواعدها لم تُنشر، فتعمل
  # المنصّة على قواعد قديمة لا يعلم أحد أنها قديمة. الآن يمشيان معًا أو لا يمشي أيّهما.
  #
  # وترتيبها قبل نشر الخدمة مقصود: البناء إن فشل لم تُمسّ القواعد، والقواعد إن فشلت لم
  # تُنشر شيفرة تعتمد عليها.
  #
  # والاعتماد من حساب خدمة Cloud Build نفسه عبر بيانات الاعتماد الافتراضية: لا رمز مخزَّن،
  # ولا تسجيل دخول، ولا سرّ يُضاف. ويلزم منح ذلك الحساب دور firebaserules.admin مرة واحدة.
  #
  # ملاحظة على الصياغة: Cloud Build يستبدل كل `$` قبل أن تصل إلى الصدفة، فلا تُستعمل هنا
  # متغيّرات صدفة ولا `$(...)` — وحده `$PROJECT_ID` مقصودٌ استبداله.
  - name: 'node:22-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -eu
        if ! npx --yes firebase-tools@15.30.0 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive; then
          echo ''
          echo 'تعذّر نشر قواعد Firestore.'
          echo 'إن كان السبب نقص صلاحية، امنح حساب خدمة Cloud Build دوره مرة واحدة:'
          echo '  gcloud projects add-iam-policy-binding mizan-f2ce3 \'
          echo '    --member=serviceAccount:<CLOUD_BUILD_SA> --role=roles/firebaserules.admin'
          exit 1
        fi

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mizan'
      - '--image'
      - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'
      - '--region'
      - 'me-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Preserve the private R2 contract on every deployment without exposing secret values to Cloud Build.
      # سلطة النزاهة تُهيَّأ مرة بـcloudbuild-integrity.yaml؛ وهذه الأسطر تُبقيها قائمة بعد كل
      # نشر. `--update-*` لا يمسّ ما لا يُذكر، فوحدة التخزين المركّبة والمفتاح يبقيان.
      - '--update-env-vars'
      - 'FIREBASE_PROJECT_ID=mizan-f2ce3,R2_ENDPOINT=https://c5d74db879abf3d428e4abdd485d338a.r2.cloudflarestorage.com,R2_BUCKET=mizan-quran-assets,MIZAN_SAAS_DATA_DIR=/mnt/authority/saas,MIZAN_INTEGRITY_AUTHORITY_DIR=/mnt/authority,MIZAN_INTEGRITY_AUTHORITY_DURABLE=true,MIZAN_CONTROL_TOWER_DIR=/mnt/authority/control-tower,MIZAN_OPS_TELEMETRY_DIR=/mnt/authority/control-tower/telemetry,MIZAN_REQUIRE_MFA_FOR_SUPER_ADMIN=true'
      - '--update-secrets'
      - 'R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest'

substitutions:
  # إعدادات Firebase العلنية. النشر الحي يتطلب المصادقة.
  # مفتاح ويب Firebase معرّف علني كبقية معرّفات Firebase أعلاه (تحميه قيود النطاق لا الإخفاء).
  _VITE_FIREBASE_API_KEY: 'AIzaSyAU13efq58hCJirGDyu9dZf8lzRatbhwcY'
  _VITE_FIREBASE_AUTH_DOMAIN: 'mizan-f2ce3.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'mizan-f2ce3'
  _VITE_FIREBASE_STORAGE_BUCKET: 'mizan-f2ce3.firebasestorage.app'
  _VITE_FIREBASE_MESSAGING_SENDER_ID: '993698501419'
  _VITE_FIREBASE_APP_ID: '1:993698501419:web:47a25e46ccbacccb17ab6e'
  _VITE_REQUIRE_AUTH: 'true'
  # موظفو الجهة: MFA اختياري وفق سياسة الجهة الحالية.
  _VITE_REQUIRE_MFA_FOR_SENSITIVE: 'false'
  # مالك المنصة: MFA إلزامي في الإنتاج بشكل مستقل عن سياسة موظفي الجهة.
  _VITE_REQUIRE_MFA_FOR_SUPER_ADMIN: 'true'

images:
  - 'me-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/mizan:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
